<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avern Database Reset</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111214;
      color: #eee;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      width: min(560px, 100%);
      background: #1e1f22;
      padding: 24px;
      border: 1px solid #33363b;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    }
    h1 { margin-top: 0; }
    code { color: #c9cdfb; }
    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 0;
      border-radius: 7px;
      background: #da373c;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: #b92d32; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre {
      min-height: 52px;
      margin-bottom: 0;
      padding: 12px;
      border-radius: 7px;
      background: #151619;
      color: #b5bac1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .warning { color: #ffb8ba; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Avern hard reset</h1>
    <p>
      This resets <code>avern-game-default-rtdb</code>. It keeps
      <code>/server_channels</code> and permanently deletes every other
      Realtime Database path.
    </p>
    <p class="warning">
      Only run this while the database rules allow public reads and writes.
      This action cannot be undone unless you have a backup.
    </p>
    <button id="go">Hard reset Avern</button>
    <pre id="status">Nothing changed yet.</pre>
  </main>

  <script>
    const DATABASE_URL = "https://avern-game-default-rtdb.firebaseio.com";
    const CONFIRMATION = "HARD RESET AVERN";

    const statusBox = document.getElementById("status");
    const resetButton = document.getElementById("go");

    function say(message) {
      statusBox.textContent = message;
    }

    async function request(path = "", options = {}) {
      const cleanPath = path.replace(/^\/+|\/+$/g, "");
      const url = `${DATABASE_URL}/${cleanPath ? cleanPath + "/" : ""}.json`;
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      if (!response.ok) {
        let details = "";
        try {
          const data = await response.json();
          details = data?.error ? `: ${data.error}` : "";
        } catch (_) {}
        throw new Error(`Firebase request failed (${response.status})${details}`);
      }

      return response.json();
    }

    resetButton.addEventListener("click", async () => {
      resetButton.disabled = true;

      try {
        say("Reading channel data...");
        const channels = await request("server_channels");

        if (!channels || typeof channels !== "object" || Array.isArray(channels)) {
          throw new Error(
            "/server_channels is missing or invalid. Nothing was deleted."
          );
        }

        const channelCount = Object.keys(channels).length;
        const typed = prompt(
          `This will permanently delete everything except /server_channels (${channelCount} top-level channel entries).\n\nType exactly: ${CONFIRMATION}`
        );

        if (typed !== CONFIRMATION) {
          throw new Error("Cancelled. Nothing was deleted.");
        }

        say("Resetting database...");
        await request("", {
          method: "PUT",
          body: JSON.stringify({ server_channels: channels })
        });

        localStorage.clear();
        sessionStorage.clear();

        say(
          `DONE. Preserved ${channelCount} top-level channel entr${channelCount === 1 ? "y" : "ies"}.\n\n` +
          "All other database data was deleted. Refresh or reopen Avern to create a new profile."
        );
      } catch (error) {
        console.error(error);
        say(
          `FAILED: ${error?.message || error}\n\n` +
          "If this says Permission denied, confirm that the Realtime Database rules currently have both .read and .write set to true."
        );
      } finally {
        resetButton.disabled = false;
      }
    });
  </script>
</body>
</html>
