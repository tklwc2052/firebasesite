;border:1px solid var(--line);border-radius:8px;outline:0;background:#11141b;color:#fff}.search:focus{border-color:var(--accent)}.page{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{border:1px solid var(--line);border-radius:11px;background:var(--panel)}.stat{padding:17px}.stat span{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.stat strong{display:block;margin-top:7px;font-size:27px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.panel-body{padding:10px 14px}.row{display:flex;align-items:center;gap:11px;padding:10px 5px;border-bottom:1px solid rgba(255,255,255,.045)}.row:last-child{border-bottom:0}.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;object-fit:cover;background:#303747}.row-copy{min-width:0;flex:1}.row-title{overflow:hidden;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.row-sub{margin-top:3px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:#dfe3eb;font-size:10px;font-weight:800}.badge.red{background:rgba(237,66,69,.15);color:#ff8588}.badge.green{background:rgba(53,208,127,.15);color:#69e9a1}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{border:0;border-radius:6px;padding:6px 8px;background:#303644;color:#fff;font-size:11px;font-weight:750;cursor:pointer}.mini:hover{filter:brightness(1.15)}.mini.red{background:rgba(237,66,69,.18);color:#ff898d}.empty{padding:30px;color:var(--muted);text-align:center}.channel-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:rgba(124,140,255,.13);color:#b0b8ff;font-weight:900}.log-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}.notice{margin-bottom:14px;padding:11px 13px;border:1px solid rgba(240,178,50,.3);border-radius:8px;background:rgba(240,178,50,.08);color:#e7c96e;font-size:12px}.dialog{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.7)}.dialog-card{width:min(430px,100%);padding:20px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.dialog-card h3{margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#11141b;color:#fff}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#181c24;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13px}@media(max-width:800px){.app{grid-template-columns:72px minmax(0,1fr)}.brand small,.brand span,.nav button span,.sidebar-foot .admin-name{display:none}.nav button{justify-content:center;font-size:20px}.sidebar-foot{padding:4px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.page{padding:14px}}@media(max-width:500px){.stats{grid-template-columns:1fr}.search{width:45%}.actions{width:100%;justify-content:flex-start}.row{flex-wrap:wrap}}

<body>
<section id="gate" class="gate"><div class="gate-card"><h1>Avern Admins</h1><p id="gateMessage">Checking account access...</p><a class="primary" style="display:inline-block;text-decoration:none" href="/chat/">Back to chat</a></div></section>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAgOggS_nTmOubBXXg6mjI9twxsOgRlluk",authDomain:"ilikespacedotcom.firebaseapp.com",databaseURL:"https://ilikespacedotcom-default-rtdb.firebaseio.com",projectId:"ilikespacedotcom",storageBucket:"ilikespacedotcom.firebasestorage.app",messagingSenderId:"535073068352",appId:"1:535073068352:web:9e4b7f30ee118154af56a5"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let me='',myData={},roles={},users={},channels={},logs=[],pageName='overview';const adminPerms=['viewlogs','setrank','createchannel','deletechannel','ban','mute','warn','clear','lockchannel','slowmode','pinmsg','delete-user'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="#5865f2"/><circle cx="50" cy="38" r="20" fill="white"/><path d="M15 95c5-25 18-38 35-38s30 13 35 38" fill="white"/></svg>');
function isAdmin(){if(me==='kl_')return true;const role=roles[myData.role||myData.rank||'Member']||{},p=String(role.allowedCommands||'').split(',').map(x=>x.trim().toLowerCase());return p.includes('*')||p.some(x=>adminPerms.includes(x))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}function query(){return document.getElementById('search').value.trim().toLowerCase()}function showPage(name,button){pageName=name;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));button?.classList.add('active');document.getElementById('pageTitle').textContent=name[0].toUpperCase()+name.slice(1);document.getElementById('search').placeholder='Search '+name;renderCurrentPage()}function filteredUsers(){const q=query();return Object.entries(users).filter(([k,v])=>!q||k.includes(q)||String(v.username||'').toLowerCase().includes(q)||String(v.nickname||'').toLowerCase().includes(q)||String(v.role||v.rank||'Member').toLowerCase().includes(q))}function online(v){return v.presenceState==='online'&&Date.now()-Number(v.lastSeen||0)<90000}function userRow(k,v,buttons=true){const name=v.nickname||v.username||k,rank=v.role||v.rank||'Member';return `<div class="row"><img class="avatar" src="${esc(v.pfp||fallback)}"><div class="row-copy"><div class="row-title">${esc(name)}</div><div class="row-sub">@${esc(v.username||k)} · <span style="color:${esc(roles[rank]?.color||'#dbdee1')}">${esc(rank)}</span></div></div><span class="badge ${online(v)?'green':''}">${online(v)?'ONLINE':'OFFLINE'}</span>${buttons?`<div class="actions"><button class="mini" onclick="openUserPage('${esc(k)}')">View</button><button class="mini" onclick="rankDialog('${esc(k)}')">Rank</button><button class="mini red" onclick="moderateDialog('${esc(k)}')">Moderate</button></div>`:''}</div>`}function openUserPage(k){window.open('/chat/u/'+encodeURIComponent(k),'_blank')}
function renderOverview(){const vals=Object.values(users),banned=vals.filter(v=>Number(v.bannedUntil||0)>Date.now()).length,muted=vals.filter(v=>Number(v.mutedUntil||0)>Date.now()).length,on=vals.filter(online).length;document.getElementById('page').innerHTML=`<div class="notice">This page has a client-side access gate. Your Firebase rules must also restrict administrative writes.</div><div class="stats"><div class="stat"><span>Users</span><strong>${vals.length}</strong></div><div class="stat"><span>Online</span><strong>${on}</strong></div><div class="stat"><span>Muted</span><strong>${muted}</strong></div><div class="stat"><span>Banned</span><strong>${banned}</strong></div></div><div class="grid2"><section class="panel"><div class="panel-head"><h2>Recently seen</h2></div><div class="panel-body">${Object.entries(users).sort((a,b)=>Number(b[1].lastSeen||0)-Number(a[1].lastSeen||0)).slice(0,6).map(([k,v])=>userRow(k,v,false)).join('')||'<div class="empty">No users</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Active moderation</h2></div><div class="panel-body">${Object.entries(users).filter(([,v])=>Number(v.bannedUntil||0)>Date.now()||Number(v.mutedUntil||0)>Date.now()).map(([k,v])=>userRow(k,v)).join('')||'<div class="empty">No active actions</div>'}</div></section></div>`}
function renderUsers(){document.getElementById('page').innerHTML=`<section class="panel"><div class="panel-head"><h2>All users</h2><span class="badge">${filteredUsers().length}</span></div><div class="panel-body">${filteredUsers().map(([k,v])=>userRow(k,v)).join('')||'<div class="empty">No matching users</div>'}</div></section>`}function renderRanks(){const groups={};filteredUsers().forEach(([k,v])=>{const r=v.role||v.rank||'Member';(groups[r]??=[]).push([k,v])});document.getElementById('page').innerHTML=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([r,list])=>`<section class="panel" style="margin-bottom:14px"><div class="panel-head"><h2 style="color:${esc(roles[r]?.color||'#dbdee1')}">${esc(r)}</h2><span class="badge">${list.length}</span></div><div class="panel-body">${list.map(([k,v])=>userRow(k,v)).join('')}</div></section>`).join('')||'<div class="empty">No ranks</div>'}function renderModeration(){const rows=filteredUsers().filter(([,v])=>Number(v.bannedUntil||0)>Date.now()||Number(v.mutedUntil||0)>Date.now());document.getElementById('page').innerHTML=`<section class="panel"><div class="panel-head"><h2>Muted and banned users</h2></div><div class="panel-body">${rows.map(([k,v])=>userRow(k,v)).join('')||'<div class="empty">No active moderation actions</div>'}</div></section>`}function renderChannels(){const q=query(),list=Object.entries(channels).filter(([k])=>!q||k.includes(q));document.getElementById('page').innerHTML=`<section class="panel"><div class="panel-head"><h2>Server channels</h2><button class="primary" onclick="channelDialog()">Add channel</button></div><div class="panel-body">${list.map(([k,v])=>`<div class="row"><div class="channel-icon">#</div><div class="row-copy"><div class="row-title">${esc(k)}</div><div class="row-sub">${esc(v?.type||'text')}</div></div><button class="mini red" onclick="deleteChannel('${esc(k)}')">Delete</button></div>`).join('')||'<div class="empty">No channels</div>'}</div></section>`}function renderLogs(){const q=query(),items=logs.filter(v=>!q||JSON.stringify(v).toLowerCase().includes(q));document.getElementById('page').innerHTML=`<section class="panel"><div class="panel-head"><h2>Moderation logs</h2></div><div class="panel-body">${items.map(v=>`<div class="row"><div class="row-copy"><div class="row-title">${esc(v.action||v.user||'Log entry')}</div><div class="row-sub">${esc(v.moderator||'')} ${v.timestamp?'· '+new Date(v.timestamp).toLocaleString():''}</div><div class="log-text">${esc(v.msg||'')}</div></div></div>`).join('')||'<div class="empty">No matching logs</div>'}</div></section>`}function renderCurrentPage(){({overview:renderOverview,users:renderUsers,ranks:renderRanks,moderation:renderModeration,channels:renderChannels,logs:renderLogs}[pageName]||renderOverview)()}
function closeDialog(){document.getElementById('dialog').hidden=true}function setDialog(title,body,save){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialogSave').onclick=save;document.getElementById('dialog').hidden=false}function rankDialog(k){const current=users[k]?.role||users[k]?.rank||'Member',opts=[...new Set(['Member',...Object.keys(roles)])];setDialog('Change rank for @'+k,`<div class="field"><label>Rank</label><select id="rankValue">${opts.map(r=>`<option ${r===current?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`,async()=>{const r=document.getElementById('rankValue').value;await db.ref('chat_profiles/'+k).update({role:r,rank:r});await log('set_role',k,'Set rank to '+r);closeDialog();toast('Rank updated')})}function moderateDialog(k){const v=users[k]||{};setDialog('Moderate @'+k,`<div class="field"><label>Action</label><select id="modAction"><option value="mute">Mute</option><option value="ban">Ban</option><option value="clear">Clear mute and ban</option></select></div><div class="field"><label>Minutes</label><input id="modMinutes" type="number" min="1" value="10"></div><div class="field"><label>Reason</label><input id="modReason" maxlength="180" placeholder="Reason"></div>`,async()=>{const a=document.getElementById('modAction').value,m=Math.max(1,Number(document.getElementById('modMinutes').value)||10),reason=document.getElementById('modReason').value.trim(),update={};if(a==='mute'){update.mutedUntil=Date.now()+m*60000;update.muteReason=reason}if(a==='ban'){update.bannedUntil=Date.now()+m*60000;update.banReason=reason}if(a==='clear'){update.mutedUntil=0;update.muteReason='';update.bannedUntil=0;update.banReason=''}await db.ref('chat_profiles/'+k).update(update);await log(a,k,reason||a);closeDialog();toast('Moderation updated')})}function channelDialog(){setDialog('Create channel',`<div class="field"><label>Name</label><input id="channelName" maxlength="40" placeholder="new-channel"></div><div class="field"><label>Type</label><select id="channelType"><option>text</option><option>forum</option><option>leaderboard</option></select></div>`,async()=>{const n=document.getElementById('channelName').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-'),t=document.getElementById('channelType').value;if(!n)return;await db.ref('server_channels/'+n).set({type:t,createdBy:me,createdAt:Date.now()});await log('create_channel',n,'Created '+t+' channel');closeDialog();toast('Channel created')})}async function deleteChannel(k){if(['game-chat','logs'].includes(k)||!confirm('Delete #'+k+' and its messages?'))return;const u={};u['server_channels/'+k]=null;u['channels/'+k]=null;u['forum_channels/'+k]=null;await db.ref().update(u);await log('delete_channel',k,'Deleted channel');toast('Channel deleted')}async function log(action,target,msg){return db.ref('channels/logs').push({isModLog:true,user:'MOD LOG',action,target,moderator:me,msg,timestamp:Date.now()})}
document.getElementById('dialog').onclick=closeDialog;auth.onAuthStateChanged(async user=>{if(!user){document.getElementById('gateMessage').textContent='Log in through Avern Chat first.';return}try{const map=await db.ref('uid_usernames/'+user.uid).once('value');me=String(map.val()||'').toLowerCase();if(!me)throw Error('No username is linked to this account.');const [u,r,c,l]=await Promise.all([db.ref('chat_profiles').once('value'),db.ref('roles').once('value'),db.ref('server_channels').once('value'),db.ref('channels/logs').limitToLast(150).once('value')]);users=u.val()||{};roles=r.val()||{};channels=c.val()||{};myData=users[me]||{};logs=[];l.forEach(x=>{const v=x.val()||{};if(v.isModLog)logs.unshift(v)});if(!isAdmin()){document.getElementById('gateMessage').textContent='This account does not have administrative access.';return}document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;document.getElementById('adminName').textContent='@'+me;db.ref('chat_profiles').on('value',s=>{users=s.val()||{};myData=users[me]||{};if(!isAdmin()){location.reload();return}renderCurrentPage()});db.ref('roles').on('value',s=>{roles=s.val()||{};renderCurrentPage()});db.ref('server_channels').on('value',s=>{channels=s.val()||{};renderCurrentPage()});db.ref('channels/logs').limitToLast(150).on('value',s=>{logs=[];s.forEach(x=>{const v=x.val()||{};if(v.isModLog)logs.unshift(v)});renderCurrentPage()});renderOverview()}catch(e){console.error(e);document.getElementById('gateMessage').textContent=e.message||'Could not load admin access.'}});
</script>
<style id="rank-manager-upgrade-styles">
.rank-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.rank-toolbar-copy{color:var(--muted);font-size:12px}.rank-card{margin-bottom:12px}.rank-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:230px;overflow:auto;padding:9px;border:1px solid var(--line);border-radius:8px;background:#11141b}.choice{display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border-radius:6px;background:rgba(255,255,255,.035);color:var(--text);font-size:12px;cursor:pointer}.choice:hover{background:rgba(124,140,255,.12)}.choice input{width:auto!important;margin:0;accent-color:var(--accent)}.choice span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selector-tools{display:flex;justify-content:flex-end;gap:6px;margin:6px 0}.selector-tools button{border:0;background:transparent;color:#aeb6ff;font-size:11px;font-weight:750;cursor:pointer}.wide-dialog .dialog-card{width:min(760px,100%);max-height:92vh;overflow:auto}.rank-color-row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:9px}.rank-color-row input[type=color]{height:42px;padding:3px}.rank-section-label{margin:17px 0 7px;color:#fff;font-size:13px;font-weight:850}.rank-help{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.4}.rank-list-inline{display:flex;gap:5px;flex-wrap:wrap}.rank-list-inline .badge{border:1px solid rgba(255,255,255,.06)}@media(max-width:620px){.choice-grid{grid-template-columns:1fr}.rank-toolbar{align-items:flex-start;flex-direction:column}}

<script id="rank-manager-upgrade-script">
const rankPermissionOptions=[
 ['viewlogs','View moderation logs'],['setrank','Assign ranks'],['createchannel','Create channels'],['deletechannel','Delete channels'],
 ['folders.manage','Manage channel folders'],['events.create','Create and delete events'],['forums.manage','Manage forums'],['forums.pin','Pin forum posts'],
 ['forums.lock','Lock forum posts'],['forums.delete','Delete forum posts'],['forums.solution','Resolve forum posts'],['warn','Warn users'],
 ['mute','Mute users'],['ban','Ban users'],['clear','Clear messages'],['lockchannel','Lock channels'],['slowmode','Manage slowmode'],
 ['pinmsg','Pin messages'],['announce','Send announcements'],['delete-user','Delete users'],['*','All permissions']
];
function userRankNames(profile){const list=Array.isArray(profile?.ranks)?profile.ranks:[];return [...new Set([...list,profile?.rank,profile?.role].map(v=>String(v||'').trim()).filter(Boolean))];}
function csvValues(value){return String(value||'').split(',').map(v=>v.trim()).filter(Boolean)}
function checkedValues(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input=>input.value)}
function choiceGrid(name,items,selected,labeler){const chosen=new Set(selected);return `<div class="selector-tools"><button type="button" onclick="setAllChoices('${name}',true)">Select all</button><button type="button" onclick="setAllChoices('${name}',false)">Clear</button></div><div class="choice-grid">${items.map(item=>{const value=Array.isArray(item)?item[0]:item,label=Array.isArray(item)?item[1]:(labeler?labeler(item):item);return `<label class="choice"><input type="checkbox" name="${esc(name)}" value="${esc(value)}" ${chosen.has(value)?'checked':''}><span>${esc(label)}</span></label>`}).join('')}</div>`}
function setAllChoices(name,state){document.querySelectorAll(`input[name="${name}"]`).forEach(input=>input.checked=state)}
function rankBadges(profile){const names=userRankNames(profile);return `<div class="rank-list-inline">${(names.length?names:['Member']).map(name=>`<span class="badge" style="color:${esc(roles[name]?.color||'#dfe3eb')}">${esc(name)}</span>`).join('')}</div>`}
userRow=function(k,v,buttons=true){const name=v.nickname||v.username||k;return `<div class="row"><img class="avatar" src="${esc(v.pfp||fallback)}"><div class="row-copy"><div class="row-title">${esc(name)}</div><div class="row-sub">@${esc(v.username||k)}</div>${rankBadges(v)}</div><span class="badge ${online(v)?'green':''}">${online(v)?'ONLINE':'OFFLINE'}</span>${buttons?`<div class="actions"><button class="mini" onclick="openUserPage('${esc(k)}')">View</button><button class="mini" onclick="rankDialog('${esc(k)}')">Ranks</button><button class="mini red" onclick="moderateDialog('${esc(k)}')">Moderate</button></div>`:''}</div>`}
rankDialog=function(k){const selected=userRankNames(users[k]||{}),opts=[...new Set(['Member',...Object.keys(roles)])].sort((a,b)=>a.localeCompare(b));document.getElementById('dialog').classList.add('wide-dialog');setDialog('Select ranks for @'+k,`<div class="rank-help">Choose one or more ranks. The first selected rank becomes the primary rank for older parts of the app, while the full selection is saved in <code>ranks</code>.</div>${choiceGrid('userRankChoice',opts,selected)}`,async()=>{let picked=checkedValues('userRankChoice');if(!picked.length)picked=['Member'];await db.ref('chat_profiles/'+k).update({ranks:picked,rank:picked[0],role:picked[0],ranksUpdatedAt:firebase.database.ServerValue.TIMESTAMP});await log('set_role',k,'Set ranks to '+picked.join(', '));closeDialog();toast('Ranks updated')})}
const closeDialogBeforeRanks=closeDialog;closeDialog=function(){document.getElementById('dialog').classList.remove('wide-dialog');closeDialogBeforeRanks()}
function rankEditorDialog(rankName=''){const editing=!!rankName,data=roles[rankName]||{},channelNames=Object.keys(channels).sort(),write=csvValues(data.allowedChannels||'*'),visible=csvValues(data.visibleChannels??'*'),perms=csvValues(data.allowedCommands||''),parents=Array.isArray(data.parents)?data.parents:csvValues(data.parents||'');document.getElementById('dialog').classList.add('wide-dialog');const allChannels=write.includes('*'),allVisible=visible.includes('*');setDialog(editing?'Edit rank: '+rankName:'Create rank',`<div class="rank-color-row"><div class="field"><label>Rank name</label><input id="rankEditorName" maxlength="40" value="${esc(rankName)}" ${editing?'disabled':''} placeholder="Moderator"></div><div class="field"><label>Color</label><input id="rankEditorColor" type="color" value="${esc(data.color||'#dbdee1')}"></div></div><div class="rank-section-label">Channels this rank can type in</div><label class="choice" style="margin-bottom:7px"><input id="rankWriteAll" type="checkbox" ${allChannels?'checked':''} onchange="document.querySelectorAll('input[name=rankWriteChannel]').forEach(x=>x.disabled=this.checked)"><span>All current and future channels</span></label>${choiceGrid('rankWriteChannel',channelNames,allChannels?[]:write)}<div class="rank-section-label">Channels this rank can see</div><label class="choice" style="margin-bottom:7px"><input id="rankVisibleAll" type="checkbox" ${allVisible?'checked':''} onchange="document.querySelectorAll('input[name=rankVisibleChannel]').forEach(x=>x.disabled=this.checked)"><span>All current and future channels</span></label>${choiceGrid('rankVisibleChannel',channelNames,allVisible?[]:visible)}<div class="rank-section-label">Permissions</div>${choiceGrid('rankPermissionChoice',rankPermissionOptions,perms)}<div class="rank-section-label">Parent ranks</div><div class="rank-help">This is saved for rank hierarchy support. Select ranks whose access this rank should inherit.</div>${choiceGrid('rankParentChoice',Object.keys(roles).filter(name=>name!==rankName).sort(),parents)}`,async()=>{const name=(editing?rankName:document.getElementById('rankEditorName').value.trim());if(!name)return toast('Enter a rank name');if(!editing&&roles[name])return toast('That rank already exists');const allowedChannels=document.getElementById('rankWriteAll').checked?'*':checkedValues('rankWriteChannel').join(',');const visibleChannels=document.getElementById('rankVisibleAll').checked?'*':checkedValues('rankVisibleChannel').join(',');const allowedCommands=checkedValues('rankPermissionChoice').join(',');const parentRanks=checkedValues('rankParentChoice');await db.ref('roles/'+name).set({allowedChannels,visibleChannels,allowedCommands,color:document.getElementById('rankEditorColor').value,parents:parentRanks});await log(editing?'edit_rank':'create_rank',name,(editing?'Updated ':'Created ')+name);closeDialog();toast(editing?'Rank updated':'Rank created')});setTimeout(()=>{document.querySelectorAll('input[name=rankWriteChannel]').forEach(x=>x.disabled=allChannels);document.querySelectorAll('input[name=rankVisibleChannel]').forEach(x=>x.disabled=allVisible)},0)}
async function deleteRankDefinition(name){if(name==='Member')return toast('Member cannot be deleted');if(!confirm(`Delete the rank "${name}"? Users with it will keep the name until reassigned.`))return;await db.ref('roles/'+name).remove();await log('delete_rank',name,'Deleted rank');toast('Rank deleted')}
renderRanks=function(){const q=query(),roleEntries=Object.entries(roles).filter(([name])=>!q||name.toLowerCase().includes(q));document.getElementById('page').innerHTML=`<div class="rank-toolbar"><div><strong>Rank manager</strong><div class="rank-toolbar-copy">Create ranks, choose channels and permissions, then assign multiple ranks to each user.</div></div><button class="primary" onclick="rankEditorDialog()">+ Create rank</button></div>${roleEntries.map(([name,data])=>{const members=Object.entries(users).filter(([,profile])=>userRankNames(profile).includes(name));return `<section class="panel rank-card"><div class="panel-head"><div><h2 style="color:${esc(data.color||'#dbdee1')}">${esc(name)}</h2><div class="rank-meta"><span class="badge">${members.length} user${members.length===1?'':'s'}</span><span class="badge">${data.allowedChannels==='*'?'All write channels':csvValues(data.allowedChannels).length+' write channels'}</span><span class="badge">${data.visibleChannels==='*'?'All visible channels':csvValues(data.visibleChannels).length+' visible channels'}</span><span class="badge">${csvValues(data.allowedCommands).length} permissions</span></div></div><div class="actions"><button class="mini" onclick="rankEditorDialog('${esc(name)}')">Edit</button>${name!=='Member'?`<button class="mini red" onclick="deleteRankDefinition('${esc(name)}')">Delete</button>`:''}</div></div><div class="panel-body">${members.length?members.map(([k,v])=>userRow(k,v)).join(''):'<div class="empty">No users currently have this rank.</div>'}</div></section>`}).join('')||'<div class="empty">No matching ranks</div>'}`}
</script>
</body></html>
