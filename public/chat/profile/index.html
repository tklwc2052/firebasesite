<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #171a22;
      --card-2: #1e222c;
      --line: #2c3240;
      --text: #f5f7fb;
      --muted: #9ca5b7;
      --accent: #7c8cff;
      --green: #35d07f;
      --offline: #778092;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 140, 255, .14), transparent 32rem),
        radial-gradient(circle at 85% 90%, rgba(53, 208, 127, .08), transparent 28rem),
        var(--bg);
    }

    .shell { width: min(100%, 720px); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .back-link:hover { color: var(--text); }

    .profile-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(23, 26, 34, .96);
      box-shadow: 0 24px 75px rgba(0, 0, 0, .46);
    }

    .banner {
      height: 210px;
      background:
        linear-gradient(120deg, rgba(124, 140, 255, .95), rgba(104, 71, 180, .82) 55%, rgba(48, 174, 165, .8));
      background-position: center;
      background-size: cover;
    }

    .content { padding: 0 34px 34px; }

    .top-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-top: -58px;
    }

    .avatar-wrap { position: relative; flex: 0 0 auto; }

    .avatar,
    .avatar-fallback {
      width: 124px;
      height: 124px;
      border: 7px solid var(--card);
      border-radius: 50%;
      background: #303747;
      object-fit: cover;
    }

    .avatar-fallback {
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 42px;
      font-weight: 850;
    }

    .presence-dot {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 25px;
      height: 25px;
      border: 5px solid var(--card);
      border-radius: 50%;
      background: var(--offline);
    }

    .presence-dot.online { background: var(--green); }

    .presence-label {
      margin-bottom: 14px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(10, 12, 17, .38);
      font-size: 13px;
      font-weight: 700;
    }

    .identity { margin-top: 18px; }

    .name-line {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .pronouns { color: var(--muted); font-size: 15px; font-weight: 650; }

    .username {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .status {
      margin: 22px 0 0;
      padding: 13px 15px;
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      color: #dce1ec;
      background: rgba(124, 140, 255, .08);
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .bio {
      margin: 0;
      color: #d9deea;
      font-size: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .last-seen { margin: 20px 0 0; color: #7f889a; font-size: 13px; }

    .loading, .error { padding: 64px 34px; text-align: center; color: var(--muted); }
    .error { color: #ff858f; }

    @media (max-width: 560px) {
      body { padding: 18px 12px; }
      .banner { height: 160px; }
      .content { padding: 0 22px 26px; }
      .top-row { margin-top: -48px; }
      .avatar, .avatar-fallback { width: 104px; height: 104px; }
      .presence-label { margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <a class="back-link" href="/chat/">&#8592; Back to chat</a>

    <main class="profile-card">
      <div id="loading" class="loading">Loading profile...</div>
      <div id="error" class="error" hidden></div>

      <div id="profile" hidden>
        <div id="banner" class="banner"></div>

        <div class="content">
          <div class="top-row">
            <div class="avatar-wrap">
              <div id="avatarFallback" class="avatar-fallback">?</div>
              <img id="avatar" class="avatar" alt="Profile picture" hidden>
              <span id="presenceDot" class="presence-dot"></span>
            </div>
            <span id="presenceLabel" class="presence-label" hidden></span>
          </div>

          <div class="identity">
            <div class="name-line">
              <h1 id="nickname">User</h1>
              <span id="pronouns" class="pronouns" hidden></span>
            </div>
            <p id="username" class="username">@username</p>
          </div>

          <p id="status" class="status" hidden></p>

          <section class="section">
            <h2 class="section-title">About me</h2>
            <p id="bio" class="bio">This user has not added a bio.</p>
          </section>

          <p id="lastSeen" class="last-seen" hidden></p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgOggS_nTmOubBXXg6mjI9twxsOgRlluk",
      authDomain: "ilikespacedotcom.firebaseapp.com",
      databaseURL: "https://ilikespacedotcom-default-rtdb.firebaseio.com",
      projectId: "ilikespacedotcom",
      storageBucket: "ilikespacedotcom.firebasestorage.app",
      messagingSenderId: "535073068352",
      appId: "1:535073068352:web:9e4b7f30ee118154af56a5",
      measurementId: "G-ZRJ9DVTXEM"
    };

    const $ = (id) => document.getElementById(id);

    function profileKeyFromURL() {
      const parts = location.pathname.split("/").filter(Boolean);
      const index = parts.indexOf("profile");
      return index >= 0 && parts[index + 1]
        ? decodeURIComponent(parts[index + 1]).trim()
        : null;
    }

    function textValue(value) {
      return value == null ? "" : String(value).trim();
    }

    function showOptional(element, value) {
      const text = textValue(value);
      element.hidden = !text;
      if (text) element.textContent = text;
    }

    function formatLastSeen(value) {
      if (value == null || value === "") return "";
      const numeric = Number(value);
      if (!Number.isNaN(numeric)) {
        const milliseconds = numeric < 100000000000 ? numeric * 1000 : numeric;
        const date = new Date(milliseconds);
        if (!Number.isNaN(date.getTime())) return date.toLocaleString();
      }
      return String(value);
    }

    function isOnline(value) {
      const state = textValue(value).toLowerCase();
      return ["online", "active", "true", "1"].includes(state);
    }

    function setImage(image, fallback, source) {
      const url = textValue(source);
      if (!url) return;

      image.onload = () => {
        image.hidden = false;
        fallback.hidden = true;
      };
      image.onerror = () => {
        image.hidden = true;
        fallback.hidden = false;
      };
      image.src = url;
    }

    function renderProfile(key, data) {
      const nickname = textValue(data.nickname) || textValue(data.usrname) || key;
      const username = textValue(data.usrname) || key;

      document.title = `${nickname} | Profile`;
      $("nickname").textContent = nickname;
      $("username").textContent = `@${username}`;
      $("bio").textContent = textValue(data.bio) || "This user has not added a bio.";
      $("avatarFallback").textContent = nickname.charAt(0).toUpperCase() || "?";

      showOptional($("pronouns"), data.pronouns);
      showOptional($("status"), data.status);

      const presence = textValue(data.presansestate);
      showOptional($("presenceLabel"), presence);
      if (isOnline(presence)) $("presenceDot").classList.add("online");

      const lastSeen = formatLastSeen(data.lastseen);
      if (lastSeen) {
        $("lastSeen").textContent = `Last seen: ${lastSeen}`;
        $("lastSeen").hidden = false;
      }

      setImage($("avatar"), $("avatarFallback"), data.pfp);

      const banner = textValue(data.banner);
      if (banner) {
        $("banner").style.backgroundImage = `linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)), url(${JSON.stringify(banner)})`;
      }

      $("loading").hidden = true;
      $("error").hidden = true;
      $("profile").hidden = false;
    }

    function showError(message) {
      $("loading").hidden = true;
      $("profile").hidden = true;
      $("error").textContent = message;
      $("error").hidden = false;
    }

    async function loadProfile() {
      const key = profileKeyFromURL();
      if (!key) {
        showError("No profile key was included in the URL.");
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const snapshot = await get(ref(database, `chat_profiles/${key}`));

        if (!snapshot.exists()) {
          showError(`No profile exists at chat_profiles/${key}.`);
          return;
        }

        renderProfile(key, snapshot.val() || {});
      } catch (error) {
        console.error(error);
        showError(`${error?.code || "unknown-error"}: ${error?.message || "Could not load profile."}`);
      }
    }

    loadProfile();
  </script>
</body>
</html>
