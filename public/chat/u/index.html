<head>

<title>Avern User Page</title>
<style>
:root{--bg:#0b0d12;--card:#171a22;--line:#2d3342;--text:#f4f6fb;--muted:#9aa3b5;--accent:#7c8cff;--green:#35d07f;--danger:#ff6670;--page-bg:none;--page-dark:.6}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;padding:28px 16px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);position:relative}body:before{content:"";position:fixed;inset:0;background-image:var(--page-bg);background-size:cover;background-position:center;background-repeat:no-repeat;z-index:-2}body:after{content:"";position:fixed;inset:0;background:rgba(5,7,11,var(--page-dark));z-index:-1}button,input,textarea{font:inherit}.shell{width:min(100%,920px);margin:auto}.back{display:inline-block;margin-bottom:14px;color:var(--muted);text-decoration:none;font-weight:700}.back:hover{color:#fff}.card{overflow:visible;border:0;border-radius:0;background:transparent;box-shadow:none;backdrop-filter:none}.content{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.75)}.state{padding:66px 28px;text-align:center;color:var(--muted)}.error{color:#ff858f}.banner{height:230px;background:linear-gradient(120deg,var(--accent),#6847b4 55%,#30aea5);background-position:center;background-size:cover}.content{padding:0 38px 36px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:-62px}.avatar-wrap{position:relative}.avatar,.avatar-fallback{width:132px;height:132px;border:7px solid var(--card);border-radius:50%;background:#303747;object-fit:cover}.avatar-fallback{display:grid;place-items:center;font-size:44px;font-weight:900}.dot{position:absolute;right:9px;bottom:9px;width:25px;height:25px;border:5px solid var(--card);border-radius:50%;background:#778092}.dot.online{background:var(--green)}.presence{margin-bottom:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;font-weight:750}.identity{margin-top:18px}.name-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}h1{margin:0;font-size:clamp(29px,5vw,40px);overflow-wrap:anywhere}.pronouns,.username,.last-seen{color:var(--muted)}.username{margin:7px 0 0}.status{margin:22px 0 0;padding:13px 15px;border-left:3px solid var(--accent);background:rgba(124,140,255,.09);white-space:pre-wrap;overflow-wrap:anywhere}.section{margin-top:26px;padding-top:23px;border-top:1px solid var(--line)}.label{margin:0 0 10px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.bio{margin:0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.facts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025);color:#dce1eb;font-size:13px}.website{color:#9ba7ff;text-decoration:none}.last-seen{margin:20px 0 0;font-size:13px}.editor{padding:28px}.editor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}.editor-head h1{font-size:30px}.editor-head p{margin:7px 0 0;color:var(--muted)}.preview{overflow:hidden;margin-bottom:24px;border:1px solid var(--line);border-radius:16px;background:#11141b}.preview-page{padding:18px;background:linear-gradient(rgba(5,7,11,.55),rgba(5,7,11,.55)),var(--preview-bg);background-size:cover;background-position:center}.preview-card{overflow:hidden;border-radius:13px;background:rgba(17,20,27,.9)}.preview-banner{height:130px;background:linear-gradient(120deg,var(--accent),#6847b4);background-position:center;background-size:cover}.preview-row{display:flex;align-items:flex-end;gap:14px;padding:0 20px 18px;margin-top:-38px}.preview-avatar{width:88px;height:88px;border:5px solid #11141b;border-radius:50%;background:#303747;object-fit:cover}.preview-name{padding-bottom:5px}.preview-name strong{display:block;font-size:21px}.preview-name span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:11px;font-weight:830;letter-spacing:.06em;text-transform:uppercase}.field small{color:#737d90;font-size:11px}.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;outline:0;color:#fff;background:#10131a}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{min-height:112px;resize:vertical}.upload-row{display:grid;grid-template-columns:1fr auto;gap:8px}.file-btn,.secondary,.primary{border:0;border-radius:9px;padding:11px 14px;color:#fff;cursor:pointer;font-weight:780}.file-btn,.secondary{background:#303644}.primary{background:var(--accent)}.primary:disabled{opacity:.55}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.message{min-height:20px;margin-top:12px;text-align:right;color:var(--muted);font-size:13px}.good{color:var(--green)}.bad{color:var(--danger)}.auth-box{padding:55px 28px;text-align:center}.auth-box p{color:var(--muted)}input[type=range]{accent-color:var(--accent)}@media(max-width:650px){.content{padding:0 22px 27px}.banner{height:170px}.avatar,.avatar-fallback{width:108px;height:108px}.top{margin-top:-50px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.editor{padding:21px}.editor-head{flex-direction:column}.upload-row{grid-template-columns:1fr}}

</head>
<body><div class="shell"><a class="back" href="/chat/">&#8592; Back to chat</a><main class="card">
<div id="loading" class="state">Loading...</div><div id="error" class="state error" hidden></div>
<section id="viewer" hidden><div id="viewBanner" class="banner"></div><div class="content"><div class="top"><div class="avatar-wrap"><div id="viewFallback" class="avatar-fallback">?</div><img id="viewAvatar" class="avatar" alt="Avatar" hidden><span id="viewDot" class="dot"></span></div><span id="viewPresence" class="presence" hidden></span></div><div class="identity"><div class="name-line"><h1 id="viewTitle">User</h1><span id="viewPronouns" class="pronouns" hidden></span></div><p id="viewUsername" class="username">@user</p></div><p id="viewStatus" class="status" hidden></p><section class="section"><h2 id="viewAboutTitle" class="label">About me</h2><p id="viewBio" class="bio"></p><div class="facts"><span id="viewLocation" class="chip" hidden></span><a id="viewWebsite" class="chip website" target="_blank" rel="noopener noreferrer" hidden></a></div></section><p id="viewLastSeen" class="last-seen" hidden></p></div></section>
<section id="editor" class="editor" hidden><div class="editor-head"><div><h1>Edit your page</h1><p>Customize how your public Avern page appears.</p></div><a id="viewMine" class="secondary" style="text-decoration:none" href="#">View public page</a></div>
<div class="preview"><div id="previewPage" class="preview-page"><div class="preview-card"><div id="previewBanner" class="preview-banner"></div><div class="preview-row"><img id="previewAvatar" class="preview-avatar" alt="Avatar preview"><div class="preview-name"><strong id="previewName">User</strong><span id="previewUsername">@user</span></div></div></div></div></div>
<div class="grid">
<div class="field"><label>Username</label><input id="editUsername" disabled></div><div class="field"><label>Browser tab title</label><input id="editPageTitle" maxlength="50" placeholder="Text shown in the browser tab"></div><div class="field"><label>Nickname</label><input id="editNickname" maxlength="80"></div><div class="field"><label>Pronouns</label><input id="editPronouns" maxlength="30"></div><div class="field full"><label>Status</label><input id="editStatus" maxlength="100"></div><div class="field full"><label>About section title</label><input id="editAboutTitle" maxlength="40" placeholder="About me"></div><div class="field full"><label>Bio</label><textarea id="editBio" maxlength="600"></textarea></div><div class="field"><label>Location</label><input id="editLocation" maxlength="80"></div><div class="field"><label>Website</label><input id="editWebsite" maxlength="250" placeholder="https://example.com"></div>
<div class="field full"><label>Avatar</label><div class="upload-row"><input id="editPfp" maxlength="1200" placeholder="Image URL"><button class="file-btn" type="button" onclick="pickFile('pfpFile')">Upload image</button><input id="pfpFile" type="file" accept="image/*" hidden></div></div>
<div class="field full"><label>Header image</label><div class="upload-row"><input id="editBanner" maxlength="1200" placeholder="Image URL"><button class="file-btn" type="button" onclick="pickFile('bannerFile')">Upload image</button><input id="bannerFile" type="file" accept="image/*" hidden></div></div>
<div class="field full"><label>Page background</label><div class="upload-row"><input id="editPageBackground" maxlength="1200" placeholder="Image URL"><button class="file-btn" type="button" onclick="pickFile('backgroundFile')">Upload image</button><input id="backgroundFile" type="file" accept="image/*" hidden></div><small>This fills the area behind the user card.</small></div>
<div class="field"><label>Background darkness</label><input id="editBackgroundDarkness" type="range" min="0" max="85" value="60"><small id="darknessValue">60%</small></div><div class="field"><label>Accent color</label><input id="editAccent" type="color" value="#7c8cff"></div>
</div><div class="actions"><button class="secondary" onclick="location.href='/chat/'">Cancel</button><button id="saveBtn" class="primary" onclick="saveChanges()">Save changes</button></div><div id="saveMessage" class="message"></div></section>
<section id="authBox" class="auth-box" hidden><h1>Log in first</h1><p>Open Avern Chat, log in, then return here.</p><a class="primary" style="display:inline-block;text-decoration:none" href="/chat/">Go to chat</a></section>
</main></div>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAgOggS_nTmOubBXXg6mjI9twxsOgRlluk",authDomain:"ilikespacedotcom.firebaseapp.com",databaseURL:"https://ilikespacedotcom-default-rtdb.firebaseio.com",projectId:"ilikespacedotcom",storageBucket:"ilikespacedotcom.firebasestorage.app",messagingSenderId:"535073068352",appId:"1:535073068352:web:9e4b7f30ee118154af56a5",measurementId:"G-ZRJ9DVTXEM"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),ROOT=['chat','pro'+'files'].join('_'),CACHE='avern_guild_pro'+'file',IMGBB_API_KEY="8deb8d4794d99482760ff3ca309518fe";let myKey='';const $=id=>document.getElementById(id),clean=v=>v==null?'':String(v).trim();
function route(){const p=location.pathname.split('/').filter(Boolean),u=p.indexOf('u');return{me:p.includes('me'),key:u>=0&&p[u+1]?decodeURIComponent(p[u+1]).trim().toLowerCase():null}}function fail(m){$('loading').hidden=true;$('viewer').hidden=true;$('editor').hidden=true;$('error').textContent=m;$('error').hidden=false}function optional(id,v){v=clean(v);$(id).hidden=!v;if(v)$(id).textContent=v}function img(el,fallback,url){url=clean(url);if(!url)return;el.onload=()=>{el.hidden=false;if(fallback)fallback.hidden=true};el.onerror=()=>{el.hidden=true;if(fallback)fallback.hidden=false};el.src=url}function time(v){if(!v)return'';let n=Number(v);if(Number.isFinite(n)){if(n<1e11)n*=1000;const d=new Date(n);if(!Number.isNaN(d.getTime()))return d.toLocaleString()}return String(v)}function setPageBackground(url,darkness=60){document.documentElement.style.setProperty('--page-bg',clean(url)?'url('+JSON.stringify(clean(url))+')':'none');document.documentElement.style.setProperty('--page-dark',Math.max(0,Math.min(85,Number(darkness)||0))/100)}
function renderChatName(element,raw,fallback){
  const source=clean(raw)||fallback;
  const colorMatch=source.match(/(?:^|\*{1,3})(grey|gray|red|orange|yellow|green|blue|cyan|purple|pink|white)\s*:/i);
  const colors={grey:'#aeb4bf',gray:'#aeb4bf',red:'#ed4245',orange:'#f47b20',yellow:'#f0b232',green:'#57f287',blue:'#7c8cff',cyan:'#22d3ee',purple:'#a970ff',pink:'#eb459e',white:'#ffffff'};
  let shown=source.replace(/\*{1,3}(?:grey|gray|red|orange|yellow|green|blue|cyan|purple|pink|white)\s*:/i,'').replace(/\*/g,'').trim();
  if(!shown)shown=fallback;
  element.textContent=shown;
  element.style.color=colorMatch?colors[colorMatch[1].toLowerCase()]:'#ffffff';
  element.style.fontWeight=source.includes('**')?'800':'700';
  element.style.fontStyle=source.includes('*')?'italic':'normal';

function showPublic(key,d){const nick=clean(d.nickname)||clean(d.username)||clean(d.usrname)||key,title=clean(d.pageTitle)||nick,user=clean(d.username)||clean(d.usrname)||key;document.documentElement.style.setProperty('--accent',clean(d.accentColor)||'#7c8cff');setPageBackground(d.pageBackground,d.backgroundDarkness??60);document.title=title+' | Avern';renderChatName($('viewTitle'),d.nickname,user);$('viewUsername').textContent='@'+user;$('viewBio').textContent=clean(d.bio)||'No introduction has been added.';$('viewFallback').textContent=(clean(d.nickname).replace(/\*/g,'').replace(/^[^:]*:/,'').trim()||user).charAt(0).toUpperCase()||'?';optional('viewPronouns',d.pronouns);optional('viewStatus',d.status);optional('viewLocation',d.location);$('viewAboutTitle').textContent=clean(d.aboutTitle)||'About me';const site=clean(d.website);if(site){$('viewWebsite').href=/^https?:\/\//i.test(site)?site:'https://'+site;$('viewWebsite').textContent=site;$('viewWebsite').hidden=false}const state=clean(d.presenceState||d.presansestate);optional('viewPresence',state);if(state.toLowerCase()==='online')$('viewDot').classList.add('online');const seen=time(d.lastSeen||d.lastseen);if(seen){$('viewLastSeen').textContent='Last seen: '+seen;$('viewLastSeen').hidden=false}img($('viewAvatar'),$('viewFallback'),d.pfp);if(clean(d.banner))$('viewBanner').style.backgroundImage='url('+JSON.stringify(clean(d.banner))+')';$('loading').hidden=true;$('viewer').hidden=false}
async function loadEditor(user){const map=await db.ref('uid_usernames/'+user.uid).once('value');myKey=clean(map.val()).toLowerCase();if(!myKey)throw Error('Open chat once so the account can finish setting up.');const s=await db.ref(ROOT+'/'+myKey).once('value'),d=s.val()||{},userName=clean(d.username)||clean(d.usrname)||myKey;$('editUsername').value=userName;$('editPageTitle').value=clean(d.pageTitle);$('editNickname').value=clean(d.nickname);$('editPronouns').value=clean(d.pronouns);$('editStatus').value=clean(d.status);$('editAboutTitle').value=clean(d.aboutTitle)||'About me';$('editBio').value=clean(d.bio);$('editLocation').value=clean(d.location);$('editWebsite').value=clean(d.website);$('editPfp').value=clean(d.pfp);$('editBanner').value=clean(d.banner);$('editPageBackground').value=clean(d.pageBackground);$('editBackgroundDarkness').value=d.backgroundDarkness??60;$('editAccent').value=/^#[0-9a-f]{6}$/i.test(d.accentColor||'')?d.accentColor:'#7c8cff';$('viewMine').href='/chat/u/'+encodeURIComponent(myKey);updatePreview();$('loading').hidden=true;$('editor').hidden=false}
function updatePreview(){const title=clean($('editPageTitle').value)||clean($('editNickname').value)||clean($('editUsername').value)||'User',p=clean($('editPfp').value),b=clean($('editBanner').value),bg=clean($('editPageBackground').value),dark=$('editBackgroundDarkness').value,a=$('editAccent').value;renderChatName($('previewName'),$('editNickname').value,clean($('editUsername').value)||'User');$('previewUsername').textContent='@'+clean($('editUsername').value);if(p)$('previewAvatar').src=p;$('previewBanner').style.backgroundImage=b?'url('+JSON.stringify(b)+')':'linear-gradient(120deg,'+a+',#6847b4)';$('previewPage').style.backgroundImage=(bg?'linear-gradient(rgba(5,7,11,'+(dark/100)+'),rgba(5,7,11,'+(dark/100)+')),url('+JSON.stringify(bg)+')':'linear-gradient(#0b0d12,#0b0d12)');$('darknessValue').textContent=dark+'%';document.documentElement.style.setProperty('--accent',a)}['editPageTitle','editNickname','editPfp','editBanner','editPageBackground','editBackgroundDarkness','editAccent'].forEach(id=>$(id).addEventListener('input',updatePreview));function pickFile(id){$(id).click()}
async function upload(file){if(!file||!file.type.startsWith('image/'))throw Error('Choose an image file.');if(file.size>4*1024*1024)throw Error('Keep images under 4 MB.');const f=new FormData();f.append('image',file);const r=await fetch('https://api.imgbb.com/1/upload?key='+encodeURIComponent(IMGBB_API_KEY),{method:'POST',body:f}),j=await r.json();if(!r.ok||!j.success||!j.data?.url)throw Error(j?.error?.message||'Image upload failed.');return j.data.url}async function chosen(type,e){try{$('saveMessage').textContent='Uploading image...';const url=await upload(e.target.files[0]),id=type==='pfp'?'editPfp':type==='banner'?'editBanner':'editPageBackground';$(id).value=url;updatePreview();$('saveMessage').textContent='Upload complete. Save changes to keep it.'}catch(x){$('saveMessage').className='message bad';$('saveMessage').textContent=x.message}finally{e.target.value=''}}$('pfpFile').onchange=e=>chosen('pfp',e);$('bannerFile').onchange=e=>chosen('banner',e);$('backgroundFile').onchange=e=>chosen('background',e);
async function saveChanges(){const user=auth.currentUser;if(!user||!myKey)return;const update={uid:user.uid,username:clean($('editUsername').value),pageTitle:clean($('editPageTitle').value),nickname:clean($('editNickname').value),pronouns:clean($('editPronouns').value),status:clean($('editStatus').value),aboutTitle:clean($('editAboutTitle').value)||'About me',bio:clean($('editBio').value),location:clean($('editLocation').value),website:clean($('editWebsite').value),pfp:clean($('editPfp').value),banner:clean($('editBanner').value),pageBackground:clean($('editPageBackground').value),backgroundDarkness:Number($('editBackgroundDarkness').value),accentColor:$('editAccent').value,pageUpdatedAt:firebase.database.ServerValue.TIMESTAMP};$('saveBtn').disabled=true;$('saveMessage').textContent='Saving...';try{await db.ref(ROOT+'/'+myKey).update(update);$('saveMessage').className='message good';$('saveMessage').textContent='Changes saved.';let c={};try{c=JSON.parse(localStorage.getItem(CACHE)||'{}')}catch{}localStorage.setItem(CACHE,JSON.stringify({...c,...update}))}catch(x){$('saveMessage').className='message bad';$('saveMessage').textContent=(x.code||'error')+': '+x.message}finally{$('saveBtn').disabled=false}}window.pickFile=pickFile;window.saveChanges=saveChanges;const r=route();if(r.me)auth.onAuthStateChanged(u=>u?loadEditor(u).catch(x=>fail(x.message)):($('loading').hidden=true,$('authBox').hidden=false));else if(r.key)db.ref(ROOT+'/'+r.key).once('value').then(s=>s.exists()?showPublic(r.key,s.val()||{}):fail('No user page exists for '+r.key+'.')).catch(x=>fail((x.code||'error')+': '+x.message));else fail('Use /chat/me/ to edit your page or /chat/u/username to view a user page.');
