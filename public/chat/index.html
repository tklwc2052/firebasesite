<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avern Chat</title>
<style>
:root{--bg:#202225;--panel:#18191c;--input:#2a2d31;--text:#e6e8eb;--muted:#9298a1;--accent:#5865f2;--danger:#da373c}
*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font:15px system-ui,"Segoe UI",sans-serif;overflow:hidden}
#login{position:fixed;inset:0;display:grid;place-items:center;background:#111214;z-index:10}.card{width:min(390px,calc(100vw - 30px));padding:26px;background:var(--panel);border-radius:12px}.card h2{margin:0 0 18px}.card input{width:100%;padding:12px;background:var(--input);color:white;border:1px solid transparent;border-radius:7px;outline:0}.card input:focus{border-color:var(--accent)}button{border:0;border-radius:7px;cursor:pointer}.card button{width:100%;margin-top:12px;padding:12px;background:var(--accent);color:white;font-weight:700}
#app{display:none;height:100vh;grid-template-rows:54px 1fr auto}.header{display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07);font-weight:750}.header .spacer{flex:1}.header button{padding:7px 10px;background:transparent;color:var(--muted)}.header button:hover{background:rgba(255,255,255,.06);color:white}
#messages{overflow-y:auto;padding:18px max(14px,calc((100vw - 900px)/2));display:flex;flex-direction:column;gap:5px}.message{display:grid;grid-template-columns:40px 1fr;gap:11px;padding:7px;border-radius:7px}.message:hover{background:rgba(255,255,255,.025)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-weight:800}.meta{display:flex;gap:8px;align-items:baseline}.name{font-weight:750}.admin{color:#faa61a}.time{color:var(--muted);font-size:11px}.body{margin-top:2px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.system{color:#f0b232}.deleted{opacity:.6;font-style:italic}
.composer{padding:8px max(14px,calc((100vw - 900px)/2)) 16px}.input-wrap{display:flex;gap:9px;align-items:flex-end;background:var(--input);border-radius:9px;padding:9px 11px}.input-wrap:focus-within{outline:1px solid rgba(88,101,242,.65)}textarea{flex:1;resize:none;max-height:130px;background:transparent;border:0;outline:0;color:white;font:inherit;line-height:1.45}.send{padding:8px 13px;background:var(--accent);color:white;font-weight:700}.status{min-height:18px;padding:0 4px 4px;color:var(--muted);font-size:11px}
#command-menu{display:none;position:absolute;left:max(14px,calc((100vw - 900px)/2));bottom:76px;width:min(520px,calc(100vw - 28px));max-height:260px;overflow:auto;background:#111214;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:6px;box-shadow:0 12px 30px #0008}.cmd{padding:9px;border-radius:6px}.cmd:hover{background:var(--accent)}.cmd strong{display:block}.cmd small{color:var(--muted)}.cmd:hover small{color:#ddd}
.notice{padding:10px;text-align:center;color:var(--muted)}@media(max-width:600px){#messages{padding-inline:7px}.composer{padding-inline:8px}.header{padding-inline:10px}}
</style>
</head>
<body>
<div id="login"><div class="card"><h2>Join Avern Chat</h2><input id="username" maxlength="15" autocomplete="off" placeholder="Username"><button id="join">Join chat</button></div></div>
<main id="app">
  <header class="header"><span style="color:var(--muted);font-size:20px">#</span><span>chat</span><span class="spacer"></span><span id="who" style="color:var(--muted);font-weight:500"></span><button id="logout">Change user</button></header>
  <section id="messages"><div class="notice">Loading messages...</div></section>
  <section class="composer"><div class="status" id="status"></div><div class="input-wrap"><textarea id="input" rows="1" maxlength="500" placeholder="Message #chat"></textarea><button class="send" id="send">Send</button></div><div id="command-menu"></div></section>
</main>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script>
// For production, use an Ably token-auth endpoint instead of exposing an API key.
const ABLY_API_KEY = "F9uhZw.yYopLg:04EkOfPZcGMFACX4JQcb5XQjv5rJQMao5kNP-6toXP4";
const CHANNEL_NAME = "avern-one-channel-chat";
const ADMINS = new Set(["kl_", "Doge"]);
const HISTORY_LIMIT = 1000;
let me = "", ably = null, channel = null, lastSent = 0;
let messages = [], warnings = {}, moderation = {}, chatSettings = { locked:false, slowmodeMs:0 }, clearedBefore = 0;
const $ = id => document.getElementById(id);
const isAdmin = () => ADMINS.has(me.toLowerCase());
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clock = t => new Date(t || Date.now()).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const duration = v => { const m=String(v||"").match(/^(\d+)(s|m|h|d)$/i); return m ? +m[1]*({s:1e3,m:6e4,h:36e5,d:864e5}[m[2].toLowerCase()]) : null; };
const COMMANDS = [
 ["/clear [amount]","Hide all messages, or the latest amount"], ["/warn user reason","Record a warning"],
 ["/warnings user","Show recent warnings"], ["/slowmode 5s|2m|1h|off","Set message cooldown"],
 ["/lockchannel","Lock chat for non-admins"], ["/unlockchannel","Unlock chat"],
 ["/mute user 10m reason","Mute a user"], ["/unmute user","Remove a mute"],
 ["/ban user 1h reason","Ban a user"], ["/unban user","Remove a ban"]
];
function join(){
 const raw=$("username").value.trim();
 if(!raw || /\s/.test(raw)) return alert("Enter a username without spaces.");
 if(ABLY_API_KEY.includes("PASTE_YOUR")) return alert("Add your Ably API key to ABLY_API_KEY in the HTML file first.");
 me=raw; localStorage.setItem("avern_simple_user",me); $("who").textContent=me+(isAdmin()?" (admin)":"");
 $("login").style.display="none"; $("app").style.display="grid"; startAbly();
}
$("join").onclick=join; $("username").onkeydown=e=>{if(e.key==="Enter")join()};
$("logout").onclick=()=>{localStorage.removeItem("avern_simple_user"); ably?.close(); location.reload()};
function normalize(msg){ return { id:msg.id, name:msg.name, data:msg.data||{}, timestamp:msg.timestamp||Date.now() }; }
function applyEvent(event, render=true){
 const d=event.data||{};
 if(event.name==="chat") messages.push(event);
 if(event.name==="clear") { if(d.amount){ const visible=messages.filter(m=>m.timestamp>clearedBefore); visible.slice(-d.amount).forEach(m=>m.data.deleted=true); } else clearedBefore=Math.max(clearedBefore,event.timestamp); }
 if(event.name==="settings") chatSettings={...chatSettings,...d};
 if(event.name==="warn") (warnings[d.user] ||= []).push(d);
 if(event.name==="moderation") moderation[d.user]={...(moderation[d.user]||{}),...d};
 if(render) renderAll();
}
function renderAll(){
 const box=$("messages"); box.innerHTML="";
 const visible=messages.filter(m=>m.timestamp>clearedBefore && !m.data.deleted);
 if(!visible.length) box.innerHTML='<div class="notice">No messages yet.</div>';
 visible.slice(-250).forEach(event=>{
  const p=event.data, row=document.createElement("article"); row.className="message";
  const admin=ADMINS.has(String(p.user||"").toLowerCase());
  row.innerHTML=`<div class="avatar">${esc((p.user||"?").slice(0,1).toUpperCase())}</div><div><div class="meta"><span class="name ${admin?'admin':''}">${esc(p.user||'Unknown')}</span><span class="time">${clock(event.timestamp)}</span></div><div class="body ${p.system?'system':''}">${esc(p.msg||'')}</div></div>`;
  box.appendChild(row);
 });
 box.scrollTop=box.scrollHeight; updateStatus();
}
function updateStatus(){ let text=""; if(chatSettings.locked&&!isAdmin()) text="Chat is locked by an admin."; else if(chatSettings.slowmodeMs) text=`Slowmode: ${Math.ceil(chatSettings.slowmodeMs/1000)} seconds`; $("status").textContent=text; }
async function loadHistory(){
 let page=await channel.history({direction:"forwards",limit:100}); let count=0;
 while(page){ for(const msg of page.items){ applyEvent(normalize(msg),false); count++; if(count>=HISTORY_LIMIT) break; } if(count>=HISTORY_LIMIT || !page.hasNext()) break; page=await page.next(); }
 renderAll();
}
async function startAbly(){
 $("messages").innerHTML='<div class="notice">Connecting to Ably...</div>';
 ably=new Ably.Realtime({key:ABLY_API_KEY,clientId:me}); channel=ably.channels.get(CHANNEL_NAME);
 ably.connection.on("failed",state=>alert("Ably connection failed: "+(state.reason?.message||"Unknown error")));
 await channel.attach(); await loadHistory();
 channel.subscribe(msg=>applyEvent(normalize(msg),true));
 const rule=moderation[me.toLowerCase()]||{};
 if(rule.bannedUntil>Date.now()){ alert("You are banned until "+new Date(rule.bannedUntil).toLocaleString()+". Reason: "+(rule.banReason||"No reason")); ably.close(); location.reload(); }
}
async function publish(name,data){ await channel.publish(name,data); }
async function system(msg){ await publish("chat",{user:"SYSTEM",msg,system:true}); }
async function command(text){
 if(!isAdmin()){ alert("Only kl_ and Doge can use commands."); return true; }
 const parts=text.trim().split(/\s+/), cmd=parts[0].toLowerCase(), user=(parts[1]||"").replace(/^@/,"").toLowerCase();
 if(cmd==="/clear"){ const amount=parseInt(parts[1]); await publish("clear",amount?{amount:Math.min(amount,100)}:{}); return true; }
 if(cmd==="/warn"){ if(!user||parts.length<3){alert("Usage: /warn user reason");return true} const reason=parts.slice(2).join(" "); await publish("warn",{user,moderator:me,reason,at:Date.now()}); await system(`⚠ ${user} was warned by ${me}. Reason: ${reason}`); return true; }
 if(cmd==="/warnings"){ if(!user){alert("Usage: /warnings user");return true} const a=warnings[user]||[]; await system(a.length?`Warnings for ${user}:\n`+a.slice(-10).map((w,i)=>`${i+1}. ${w.reason} (${w.moderator})`).join("\n"):`${user} has no warnings.`); return true; }
 if(cmd==="/slowmode"){ const v=(parts[1]||"").toLowerCase(),ms=(v==="off"||v==="0")?0:duration(v); if(ms===null){alert("Usage: /slowmode 5s, 2m, 1h, or off");return true} await publish("settings",{slowmodeMs:ms}); await system(`${me} ${ms?'set slowmode to '+v:'disabled slowmode'}.`); return true; }
 if(cmd==="/lockchannel"||cmd==="/unlockchannel"){ const locked=cmd==="/lockchannel"; await publish("settings",{locked}); await system(`${me} ${locked?'locked':'unlocked'} the chat.`); return true; }
 if(cmd==="/mute"||cmd==="/ban"){ if(!user||parts.length<4){alert(`Usage: ${cmd} user 10m reason`);return true} const ms=duration(parts[2]); if(!ms){alert("Use a duration like 10m, 1h, or 1d.");return true} const reason=parts.slice(3).join(" "),data={user,moderator:me}; if(cmd==="/mute") Object.assign(data,{mutedUntil:Date.now()+ms,muteReason:reason}); else Object.assign(data,{bannedUntil:Date.now()+ms,banReason:reason}); await publish("moderation",data); await system(`${user} was ${cmd==='/mute'?'muted':'banned'} by ${me} for ${parts[2]}. Reason: ${reason}`); return true; }
 if(cmd==="/unmute"||cmd==="/unban"){ if(!user){alert(`Usage: ${cmd} user`);return true} const data={user,moderator:me}; if(cmd==="/unmute") Object.assign(data,{mutedUntil:0,muteReason:""}); else Object.assign(data,{bannedUntil:0,banReason:""}); await publish("moderation",data); await system(`${user} was ${cmd==='/unmute'?'unmuted':'unbanned'} by ${me}.`); return true; }
 return false;
}
async function send(){
 const input=$("input"),text=input.value.trim(); if(!text||!channel)return;
 if(text.startsWith("/")&&await command(text)){input.value="";input.style.height="auto";hideCommands();return}
 const rule=moderation[me.toLowerCase()]||{};
 if(rule.bannedUntil>Date.now()) return alert("You are banned. Reason: "+(rule.banReason||"No reason"));
 if(rule.mutedUntil>Date.now()) return alert("You are muted. Reason: "+(rule.muteReason||"No reason"));
 if(chatSettings.locked&&!isAdmin()) return alert("Chat is locked.");
 if(chatSettings.slowmodeMs&&!isAdmin()){const wait=chatSettings.slowmodeMs-(Date.now()-lastSent);if(wait>0)return alert(`Wait ${Math.ceil(wait/1000)} more second(s).`)}
 await publish("chat",{user:me,msg:text}); lastSent=Date.now(); input.value="";input.style.height="auto";hideCommands();
}
$("send").onclick=send; $("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("input").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px";showCommands(e.target.value)};
function showCommands(v){const box=$("command-menu");if(!isAdmin()||!v.startsWith("/")){hideCommands();return}const q=v.toLowerCase(),matches=COMMANDS.filter(c=>c[0].startsWith(q)||q==="/");if(!matches.length){hideCommands();return}box.innerHTML=matches.map(c=>`<div class="cmd"><strong>${esc(c[0])}</strong><small>${esc(c[1])}</small></div>`).join("");box.style.display="block"}
function hideCommands(){$("command-menu").style.display="none"}
const saved=localStorage.getItem("avern_simple_user");if(saved)$("username").value=saved;
</script>
</body>
</html>
