<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Minecraft...</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
            background: #000;
            z-index: 999999;
        }

        #progress {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div id="loading">
    <div>Loading Minecraft...</div>
    <div id="progress">Starting...</div>
</div>

<script>
(async () => {

    /*
     * PUT YOUR JSDELIVR CHUNK LINKS HERE.
     *
     * Example:
     *
     * https://cdn.jsdelivr.net/gh/tklwc2052/YOUR-REPO@main/part-001
     */

    const PART_URLS = [
    "https://cdn.jsdelivr.net/gh/tklwc2052/files@refs/heads/main/1.16.5.part1.html"
    "https://cdn.jsdelivr.net/gh/tklwc2052/files@refs/heads/main/1.16.5.part2.html"
    "https://cdn.jsdelivr.net/gh/tklwc2052/files@refs/heads/main/1.16.5.part3.html"
// Add the rest here...
    ];

    const progress = document.getElementById("progress");

    try {

        let html = "";

        for (let i = 0; i < PART_URLS.length; i++) {

            progress.textContent =
                `Loading part ${i + 1} of ${PART_URLS.length}...`;

            const response = await fetch(PART_URLS[i], {
                cache: "default"
            });

            if (!response.ok) {
                throw new Error(
                    `Failed to load part ${i + 1}: HTTP ${response.status}`
                );
            }

            html += await response.text();
        }

        progress.textContent = "Starting Minecraft...";

        /*
         * Replace the current document with the reconstructed HTML.
         */

        document.open();
        document.write(html);
        document.close();

    } catch (error) {

        console.error(error);

        document.getElementById("loading").innerHTML = `
            <h2>Failed to load Minecraft</h2>
            <p>${error.message}</p>
            <p>Try refreshing the page.</p>
        `;

    }

})();
</script>

</body>
</html>
