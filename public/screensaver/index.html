<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avern Bell Screensaver</title>
<meta name="theme-color" content="#080a10">
<!-- CUSTOM FONT: replace the URL below with your own .ttf, .otf, .woff, or .woff2 link. -->
<style>
@font-face{
  font-family:"AvernCustomFont";
  src:url("https://cdn.jsdelivr.net/gh/tklwc2052/gameimages@main/Minecraft%20Seven_2.ttf") format("truetype");
  font-display:swap;
}
:root{--custom-font:"AvernCustomFont"}
:root{--accent:#7c5cff;--green:#2fd17c;--text:#f5f7ff;--muted:#9099b5}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:var(--custom-font,Inter),ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#000;display:grid;place-items:center;cursor:default}
body.show-cursor{cursor:default}
.bg{position:fixed;inset:0;background:#000;z-index:-3}
#gravity-grid{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:auto;touch-action:none}

.life-controls{position:fixed;left:14px;top:14px;z-index:20;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid rgba(255,255,255,.10);border-radius:10px;background:rgba(8,8,10,.72);backdrop-filter:blur(10px)}
.life-controls button{border:0;border-radius:7px;background:#1c1d22;color:#e8e9ef;padding:8px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.life-controls button:hover{background:#292b32}.life-controls .life-status{min-width:54px;color:var(--muted);font-size:11px;text-align:center}.life-controls .reset-life{color:#bbb}

.wrap{position:relative;z-index:2;pointer-events:none;text-align:center;width:min(700px,88vw);padding:20px}
.status{margin-top:26px;font-size:clamp(22px,3.5vw,42px);font-weight:850;letter-spacing:-.035em}
.countdown{margin-top:4px;font-size:clamp(38px,7vw,78px);font-weight:850;line-height:.95;letter-spacing:-.065em;font-variant-numeric:tabular-nums;text-shadow:0 0 52px rgba(124,92,255,.22)}
.passing .status{color:#d7d9ff}.outside .status{color:#d3d8e7}
@media(max-width:520px){.wrap{padding:16px}@media(prefers-reduced-motion:reduce){.bg{animation:none}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="gravity-grid" aria-hidden="true"></canvas>
<div class="life-controls"><button id="life-toggle" onclick="toggleLife()">Pause</button><span id="life-status" class="life-status">Running</span><button class="reset-life" onclick="randomizeLife()">Reset</button><button class="clear-life" onclick="clearLife()">Clear</button></div>
<main class="wrap" aria-live="polite">
  <div id="status" class="status">Loading schedule...</div>
  <div id="countdown" class="countdown">--:--</div>
</main>
<script>
const AVERN_BELL_SCHEDULE=[
 {name:'1st Period',start:'7:25',end:'8:45'},
 {name:'2nd Period',start:'8:51',end:'10:15'},
 {name:'3rd Period',start:'10:21',end:'11:41'},
 {name:'Block A',start:'11:47',end:'12:17'},
 {name:'Block B',start:'12:22',end:'12:52'},
 {name:'4th Period',start:'12:58',end:'14:18'}
];
function timeToday(value,now=new Date()){const [h,m]=value.split(':').map(Number),d=new Date(now);d.setHours(h,m,0,0);return d}
function formatCountdown(ms){const seconds=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function prettyTime(value){const [h,m]=value.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function setView({status,countdown,mode=''}){document.body.classList.toggle('passing',mode==='passing');document.body.classList.toggle('outside',mode==='outside');document.getElementById('status').textContent=status;document.getElementById('countdown').textContent=countdown}
function update(){
 const now=new Date(),day=now.getDay();
 if(day===0||day===6){setView({status:'No school today',label:'Enjoy your weekend',countdown:'—',mode:'outside'});return}
 const periods=AVERN_BELL_SCHEDULE.map(p=>({...p,startAt:timeToday(p.start,now),endAt:timeToday(p.end,now)}));
 const current=periods.find(p=>now>=p.startAt&&now<p.endAt);
 if(current){const whole=current.endAt-current.startAt,elapsed=now-current.startAt;setView({status:current.name,range:`${prettyTime(current.start)} – ${prettyTime(current.end)}`,label:'Next bell in',countdown:formatCountdown(current.endAt-now),progress:elapsed/whole*100});return}
 const next=periods.find(p=>now<p.startAt);
 if(next){const before=next===periods[0],previous=periods[periods.indexOf(next)-1];const passingStart=previous?.endAt||new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0);const whole=Math.max(1,next.startAt-passingStart),elapsed=Math.max(0,now-passingStart);setView({status:before?'Before school':'Passing period',range:before?`First bell at ${prettyTime(next.start)}`:`Next: ${next.name}`,label:`${next.name} starts in`,countdown:formatCountdown(next.startAt-now),progress:before?0:elapsed/whole*100,mode:before?'outside':'passing'});return}
 setView({status:'School is over',range:'Dismissed at 2:18 PM',label:'See you tomorrow',countdown:'—',progress:100,mode:'outside'});
}
const lifeCanvas=document.getElementById('gravity-grid');
const lifeCtx=lifeCanvas.getContext('2d');
const LIFE_CELL_SIZE=28;
const LIFE_STEP_MS=115;
let lifeCols=0,lifeRows=0,lifeGrid=[],lifeNext=[],lifeRunning=true,lastLifeStep=performance.now(),lifeDrawing=false,lifeDrawValue=1,lastEditedCell='';
function makeLifeGrid(rows,cols,random=true){
 return Array.from({length:rows},()=>Array.from({length:cols},()=>random&&Math.random()<.22?1:0));
}
function resizeLife(){
 const dpr=Math.min(devicePixelRatio||1,2);
 lifeCanvas.width=Math.round(innerWidth*dpr);lifeCanvas.height=Math.round(innerHeight*dpr);
 lifeCanvas.style.width=innerWidth+'px';lifeCanvas.style.height=innerHeight+'px';
 lifeCtx.setTransform(dpr,0,0,dpr,0,0);
 const newCols=Math.ceil(innerWidth/LIFE_CELL_SIZE),newRows=Math.ceil(innerHeight/LIFE_CELL_SIZE);
 const old=lifeGrid,oldRows=lifeRows,oldCols=lifeCols;
 lifeCols=newCols;lifeRows=newRows;lifeGrid=makeLifeGrid(lifeRows,lifeCols,false);
 if(old.length){
   for(let y=0;y<Math.min(oldRows,lifeRows);y++)for(let x=0;x<Math.min(oldCols,lifeCols);x++)lifeGrid[y][x]=old[y][x];
   for(let y=0;y<lifeRows;y++)for(let x=0;x<lifeCols;x++)if(y>=oldRows||x>=oldCols)lifeGrid[y][x]=Math.random()<.22?1:0;
 }else lifeGrid=makeLifeGrid(lifeRows,lifeCols,true);
 lifeNext=makeLifeGrid(lifeRows,lifeCols,false);
}
function countLifeNeighbors(x,y){
 let count=0;
 for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
   if(!ox&&!oy)continue;
   const nx=(x+ox+lifeCols)%lifeCols,ny=(y+oy+lifeRows)%lifeRows;
   count+=lifeGrid[ny][nx];
 }
 return count;
}
function stepLife(){
 for(let y=0;y<lifeRows;y++)for(let x=0;x<lifeCols;x++){
   const neighbors=countLifeNeighbors(x,y),alive=lifeGrid[y][x]===1;
   lifeNext[y][x]=(alive&&(neighbors===2||neighbors===3))||(!alive&&neighbors===3)?1:0;
 }
 [lifeGrid,lifeNext]=[lifeNext,lifeGrid];
}
function drawLife(){
 lifeCtx.fillStyle='#000';lifeCtx.fillRect(0,0,innerWidth,innerHeight);
 lifeCtx.strokeStyle='rgba(95,98,108,.13)';lifeCtx.lineWidth=.7;lifeCtx.beginPath();
 for(let x=0;x<=innerWidth;x+=LIFE_CELL_SIZE){lifeCtx.moveTo(x+.5,0);lifeCtx.lineTo(x+.5,innerHeight)}
 for(let y=0;y<=innerHeight;y+=LIFE_CELL_SIZE){lifeCtx.moveTo(0,y+.5);lifeCtx.lineTo(innerWidth,y+.5)}lifeCtx.stroke();
 for(let y=0;y<lifeRows;y++)for(let x=0;x<lifeCols;x++)if(lifeGrid[y][x]){
   lifeCtx.fillStyle='rgba(124,126,138,.48)';
   lifeCtx.fillRect(x*LIFE_CELL_SIZE+2,y*LIFE_CELL_SIZE+2,LIFE_CELL_SIZE-3,LIFE_CELL_SIZE-3);
 }
}
function lifeLoop(time){
 if(lifeRunning&&time-lastLifeStep>=LIFE_STEP_MS){stepLife();lastLifeStep=time}
 drawLife();requestAnimationFrame(lifeLoop);
}
function toggleLife(){
 lifeRunning=!lifeRunning;
 document.getElementById('life-toggle').textContent=lifeRunning?'Pause':'Start';
 document.getElementById('life-status').textContent=lifeRunning?'Running':'Paused';
}
function randomizeLife(){lifeGrid=makeLifeGrid(lifeRows,lifeCols,true);lastLifeStep=performance.now()}
function clearLife(){lifeGrid=makeLifeGrid(lifeRows,lifeCols,false);lifeNext=makeLifeGrid(lifeRows,lifeCols,false);lastLifeStep=performance.now()}
function getLifeCell(event){
 const rect=lifeCanvas.getBoundingClientRect();
 return{x:Math.floor((event.clientX-rect.left)/LIFE_CELL_SIZE),y:Math.floor((event.clientY-rect.top)/LIFE_CELL_SIZE)};
}
function paintLifeCell(event){
 const {x,y}=getLifeCell(event),key=x+','+y;
 if(x<0||x>=lifeCols||y<0||y>=lifeRows||key===lastEditedCell)return;
 lifeGrid[y][x]=lifeDrawValue;
 lastEditedCell=key;
}
lifeCanvas.addEventListener('pointerdown',event=>{
 event.preventDefault();
 const {x,y}=getLifeCell(event);
 if(x<0||x>=lifeCols||y<0||y>=lifeRows)return;
 lifeDrawing=true;lastEditedCell='';lifeDrawValue=lifeGrid[y][x]?0:1;
 lifeCanvas.setPointerCapture?.(event.pointerId);
 paintLifeCell(event);
});
lifeCanvas.addEventListener('pointermove',event=>{if(lifeDrawing)paintLifeCell(event)});
lifeCanvas.addEventListener('pointerup',event=>{lifeDrawing=false;lastEditedCell='';lifeCanvas.releasePointerCapture?.(event.pointerId)});
lifeCanvas.addEventListener('pointercancel',()=>{lifeDrawing=false;lastEditedCell=''});
document.getElementById('life-toggle').textContent='Pause';document.getElementById('life-status').textContent='Running';
addEventListener('resize',resizeLife);resizeLife();requestAnimationFrame(lifeLoop);

update();setInterval(update,250);
</script>
</body>
</html>
