<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avern Bell Screensaver</title>
<meta name="theme-color" content="#080a10">
<!-- CUSTOM FONT: paste your font CSS link below. Google Fonts links work here. -->
<link id="custom-font-link" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/tklwc2052/gameimages@main/Minecraft%20Seven_2.ttf">
<style>
/* CUSTOM FONT: change this to the font-family name from your link. */
:root{--custom-font:"PASTE_FONT_FAMILY_NAME_HERE"}
:root{--accent:#7c5cff;--green:#2fd17c;--text:#f5f7ff;--muted:#9099b5}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:var(--custom-font,Inter),ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#000;display:grid;place-items:center;cursor:none}
body.show-cursor{cursor:default}
.bg{position:fixed;inset:0;background:#000;z-index:-2}
.bg:after{content:none}

.wrap{text-align:center;width:min(700px,88vw);padding:20px}
.brand{font-size:clamp(12px,1.5vw,16px);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:800}
.status{margin-top:26px;font-size:clamp(22px,3.5vw,42px);font-weight:850;letter-spacing:-.035em}
.time-range{margin-top:8px;color:var(--muted);font-size:clamp(14px,2vw,20px);font-weight:650}
.countdown-label{margin-top:28px;color:var(--muted);font-size:clamp(12px,1.5vw,16px);text-transform:uppercase;letter-spacing:.18em;font-weight:800}
.countdown{margin-top:4px;font-size:clamp(54px,11vw,120px);font-weight:850;line-height:.95;letter-spacing:-.065em;font-variant-numeric:tabular-nums;text-shadow:0 0 52px rgba(124,92,255,.22)}
.progress{width:min(480px,70vw);height:4px;margin:25px auto 0;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:inherit;transition:width 1s linear}
.footer{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dot{opacity:.45}
.fullscreen{position:fixed;right:18px;top:18px;border:1px solid rgba(255,255,255,.12);background:rgba(10,12,18,.45);color:var(--muted);border-radius:9px;padding:9px 12px;font:inherit;font-size:12px;font-weight:750;cursor:pointer;opacity:0;transition:opacity .2s,color .2s,background .2s;backdrop-filter:blur(10px)}
body.show-cursor .fullscreen,.fullscreen:focus{opacity:1}.fullscreen:hover{color:#fff;background:rgba(255,255,255,.08)}
.passing .status{color:#d7d9ff}.outside .status{color:#d3d8e7}
@media(max-width:520px){.wrap{padding:16px}.countdown-label{margin-top:32px}.footer{font-size:11px}}
@media(prefers-reduced-motion:reduce){.bg{animation:none}.progress-fill{transition:none}}

</style>
</head>
<body>
<div class="bg"></div>
<button class="fullscreen" onclick="toggleFullscreen()">Enter fullscreen</button>
<main class="wrap" aria-live="polite">
  <div class="brand">Avern Bell Schedule</div>
  <div id="status" class="status">Loading schedule...</div>
  <div id="time-range" class="time-range"></div>
  <div id="countdown-label" class="countdown-label">Next bell in</div>
  <div id="countdown" class="countdown">--:--</div>
  <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
</main>
<div class="footer"><span id="clock"></span><span class="dot">•</span><span id="date"></span></div>
<script>
const AVERN_BELL_SCHEDULE=[
 {name:'1st Period',start:'7:25',end:'8:45'},
 {name:'2nd Period',start:'8:51',end:'10:15'},
 {name:'3rd Period',start:'10:21',end:'11:41'},
 {name:'Block A',start:'11:47',end:'12:17'},
 {name:'Block B',start:'12:22',end:'12:52'},
 {name:'4th Period',start:'12:58',end:'14:18'}
];
function timeToday(value,now=new Date()){const [h,m]=value.split(':').map(Number),d=new Date(now);d.setHours(h,m,0,0);return d}
function formatCountdown(ms){const seconds=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function prettyTime(value){const [h,m]=value.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function setView({status,range='',label,countdown,progress=0,mode=''}){document.body.classList.toggle('passing',mode==='passing');document.body.classList.toggle('outside',mode==='outside');document.getElementById('status').textContent=status;document.getElementById('time-range').textContent=range;document.getElementById('countdown-label').textContent=label;document.getElementById('countdown').textContent=countdown;document.getElementById('progress-fill').style.width=Math.max(0,Math.min(100,progress))+'%'}
function update(){
 const now=new Date(),day=now.getDay();
 document.getElementById('clock').textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
 document.getElementById('date').textContent=now.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
 if(day===0||day===6){setView({status:'No school today',label:'Enjoy your weekend',countdown:'—',mode:'outside'});return}
 const periods=AVERN_BELL_SCHEDULE.map(p=>({...p,startAt:timeToday(p.start,now),endAt:timeToday(p.end,now)}));
 const current=periods.find(p=>now>=p.startAt&&now<p.endAt);
 if(current){const whole=current.endAt-current.startAt,elapsed=now-current.startAt;setView({status:current.name,range:`${prettyTime(current.start)} – ${prettyTime(current.end)}`,label:'Next bell in',countdown:formatCountdown(current.endAt-now),progress:elapsed/whole*100});return}
 const next=periods.find(p=>now<p.startAt);
 if(next){const before=next===periods[0],previous=periods[periods.indexOf(next)-1];const passingStart=previous?.endAt||new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0);const whole=Math.max(1,next.startAt-passingStart),elapsed=Math.max(0,now-passingStart);setView({status:before?'Before school':'Passing period',range:before?`First bell at ${prettyTime(next.start)}`:`Next: ${next.name}`,label:`${next.name} starts in`,countdown:formatCountdown(next.startAt-now),progress:before?0:elapsed/whole*100,mode:before?'outside':'passing'});return}
 setView({status:'School is over',range:'Dismissed at 2:18 PM',label:'See you tomorrow',countdown:'—',progress:100,mode:'outside'});
}
async function toggleFullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();document.querySelector('.fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen'}
let cursorTimer;function showCursor(){document.body.classList.add('show-cursor');clearTimeout(cursorTimer);cursorTimer=setTimeout(()=>document.body.classList.remove('show-cursor'),1800)}
addEventListener('mousemove',showCursor);addEventListener('keydown',e=>{showCursor();if(e.key.toLowerCase()==='f')toggleFullscreen()});document.addEventListener('fullscreenchange',()=>document.querySelector('.fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');

update();setInterval(update,250);
</script>
</body>
</html>
