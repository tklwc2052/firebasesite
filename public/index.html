<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lander</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/Sw7nj3ZR/Screenshot-2026-08-26-8-26-57-PM-removebg-preview.png">
  <style>



    
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: black;
    }

    #desktop {
      width: 100%;
      height: 100%;
      padding: 10px;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(auto-fill, 88px);
      grid-auto-columns: 84px;
      align-content: start;
      justify-content: start;
      gap: 4px;
      background-color: black;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .shortcut {
      width: 84px;
      height: 88px;
      padding: 5px 3px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      cursor: default;
    }

    .shortcut:hover {
      border-color: rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.035);
    }

    .shortcut:focus {
      outline: none;
    }

    .shortcut-image {
      width: 50px;
      height: 50px;
      object-fit: contain;
      pointer-events: none;
    }

    .shortcut-name {
      width: 78px;
      color: inherit;
      font-size: 12px;
      line-height: 14px;
      text-align: center;
      overflow-wrap: anywhere;
      text-shadow: inherit;
      pointer-events: none;
      margin-top: auto;
      min-height: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #emptyMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #777;
      font-size: 14px;
      text-align: center;
    }
    .corner-image {
  position: fixed;
  right: 20px;
  bottom: 0px;

  width: 150px;
  height: auto;

  object-fit: contain;
  z-index: 100;
  pointer-events: auto;
  cursor: default;
}
  </style>
</head>
<body>
  <main id="desktop"></main>

  <script>
    /* ============================================================
       ONLY EDIT THIS SECTION
       ============================================================ */

    const DESKTOP_BACKGROUND = {
      // Paste a direct image URL between the quotation marks.
      // Leave it blank for a plain white background.
      imageUrl: "",

      // Use "cover" to fill the screen or "contain" to show all of it.
      size: "cover",

      // Examples: "center", "top", "left", or "center top".
      position: "center"
    };

    const DESKTOP_FILES = [
      {
        name: "Chat",
        pageUrl: "/chat/",
        imageUrl: "https://i.ibb.co/Nw6WW8J/download.png"
      },
      {
        name: "Bio",
        pageUrl: "/about/",
        imageUrl: "https://i.ibb.co/4RNR3CR3/jack.png"
      },
      {
        name: "1.14.4",
        pageUrl: "/1.14.4/",
        imageUrl: "https://i.ibb.co/Qj62zwBG/download.jpg"
      },
      {
        name: "info",
        pageUrl: "/info/",
        imageUrl: "https://i.ibb.co/9mLfZ6Nz/download-1.jpg"
      },
      
      {
        name: "launcher",
        pageUrl: "/launcher/",
        imageUrl: "https://i.ibb.co/wF0L2pkq/Screenshot-2026-06-04-12-06-23-AM.png"
      },
      
      {
        name: "snowrider3d",
        pageUrl: "/snowrider3d/",
        imageUrl: "https://i.ibb.co/N6jHrJ7Z/images.jpg"
      }

      /*
        TO ADD ANOTHER FILE, add a comma after the item above and paste:

        ,{
          name: "New Page",
          pageUrl: "PASTE_PAGE_LINK_HERE",
          imageUrl: "PASTE_ICON_IMAGE_LINK_HERE"
        }
      */
    ];

    /* ============================================================
       DO NOT EDIT BELOW THIS LINE UNLESS YOU WANT TO CHANGE THE CODE
       ============================================================ */

    const desktop = document.getElementById("desktop");

    if (DESKTOP_BACKGROUND.imageUrl.trim()) {
      desktop.style.backgroundImage = `url("${DESKTOP_BACKGROUND.imageUrl}")`;
      desktop.style.backgroundSize = DESKTOP_BACKGROUND.size || "cover";
      desktop.style.backgroundPosition = DESKTOP_BACKGROUND.position || "center";

      // White text is easier to read over most wallpapers.
      document.documentElement.style.setProperty("--shortcut-text", "white");
    }

    DESKTOP_FILES.forEach((file) => {
      const shortcut = document.createElement("button");
      shortcut.className = "shortcut";
      shortcut.type = "button";
      shortcut.title = `Double-click to open ${file.name}`;

      if (DESKTOP_BACKGROUND.imageUrl.trim()) {
        shortcut.style.color = "white";
        shortcut.style.textShadow = "1px 1px 3px black";
      }

      const image = document.createElement("img");
      image.className = "shortcut-image";
      image.src = file.imageUrl;
      image.alt = `${file.name} icon`;
      image.draggable = false;

      image.addEventListener("error", () => {
        image.style.display = "none";
      });

      const name = document.createElement("span");
      name.className = "shortcut-name";
      name.textContent = file.name;

      shortcut.append(image, name);
      desktop.appendChild(shortcut);

      shortcut.addEventListener("click", (event) => {
        // Prevents a click from affecting the desktop while keeping
        // the shortcut free of a persistent selection highlight.
        event.stopPropagation();
      });

      shortcut.addEventListener("dblclick", () => {
        const link = file.pageUrl.trim();

        if (!link || link.startsWith("PASTE_")) {
          alert(`Add the pageUrl for ${file.name} in DESKTOP_FILES.`);
          return;
        }

        window.location.href = link;
      });
    });

  </script>

  <img
    id="cornerImage"
    class="corner-image"
    src="https://i.ibb.co/Sw7nj3ZR/Screenshot-2026-08-26-8-26-57-PM-removebg-preview.png"
    alt="YouTube"
  >

  <script>
    const cornerImage = document.getElementById("cornerImage");
    let hoverTimer;

    cornerImage.addEventListener("mouseenter", function () {
      hoverTimer = window.setTimeout(function () {
        window.location.href = "https://www.youtube.com/watch?v=xvFZjo5PgG0";
      }, 1000);
    });

    cornerImage.addEventListener("mouseleave", function () {
      window.clearTimeout(hoverTimer);
    });
  </script>
</body>
</html>
