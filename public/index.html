<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lander</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/spTsw5tw/download-2.jpg">
  <style>



    
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: white;
    }

    #desktop {
      width: 100%;
      height: 100%;
      padding: 10px;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(auto-fill, 88px);
      grid-auto-columns: 84px;
      align-content: start;
      justify-content: start;
      gap: 4px;
      background-color: white;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .shortcut {
      width: 84px;
      height: 88px;
      padding: 5px 3px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      cursor: default;
    }

    .shortcut:hover {
      border-color: rgba(0, 0, 0, 0.08);
      background: rgba(0, 0, 0, 0.035);
    }

    .shortcut:focus {
      outline: none;
    }

    .shortcut-image {
      width: 50px;
      height: 50px;
      object-fit: contain;
      pointer-events: none;
    }

    .shortcut-name {
      width: 78px;
      color: inherit;
      font-size: 12px;
      line-height: 14px;
      text-align: center;
      overflow-wrap: anywhere;
      text-shadow: inherit;
      pointer-events: none;
      margin-top: auto;
      min-height: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #emptyMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #777;
      font-size: 14px;
      text-align: center;
    }
    .corner-image {
  position: fixed;
  right: 20px;
  bottom: 0px;

  width: 150px;
  height: auto;

  object-fit: contain;
  z-index: 100;
  pointer-events: auto;
  cursor: default;
}


    .top-popup-image {
      position: fixed;
      top: 0;
      left: 50%;
      width: 220px;
      max-height: 180px;
      object-fit: contain;
      z-index: 200;
      cursor: pointer;
      opacity: 0;
      transform: translate(-50%, -110%);
      transition: transform 0.55s ease, opacity 0.35s ease;
    }

    .top-popup-image.visible {
      opacity: 1;
      transform: translate(-50%, 14px);
    }

    .message-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0px;
      background: rgba(0, 0, 0, 0.48);
    }

    .message-overlay.open {
      display: flex;
    }

    .message-box {
      position: relative;
      width: min(460px, 100%);
      max-height: 80vh;
      overflow: auto;
      padding: 30px 28px 25px;
      border: 1px solid #d8d8d8;
      border-radius: 10px;
      background: white;
      color: #111;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.3);
    }

    .message-box h2 {
      margin: 0 35px 15px 0;
      font-size: 21px;
    }

    .message-box p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #333;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .message-close:hover {
      background: #eeeeee;
    }
  </style>
</head>
<body>
  <main id="desktop"></main>



  <img
    id="topPopupImage"
    class="top-popup-image"
    src=""
    alt="Open message"
  >

  <div id="messageOverlay" class="message-overlay" aria-hidden="true">
    <section class="message-box" role="dialog" aria-modal="true" aria-labelledby="friendMessageTitle">
      <button id="messageClose" class="message-close" type="button" aria-label="Close message" title="Close">&times;</button>
      <h2 id="friendMessageTitle"></h2>
      <p id="friendMessageText"></p>
    </section>
  </div>

  <script>
    /* ============================================================
       ONLY EDIT THIS SECTION
       ============================================================ */

    const DESKTOP_BACKGROUND = {
      // Paste a direct image URL between the quotation marks.
      // Leave it blank for a plain white background.
      imageUrl: "",

      // Use "cover" to fill the screen or "contain" to show all of it.
      size: "cover",

      // Examples: "center", "top", "left", or "center top".
      position: "center"
    };

    const DESKTOP_FILES = [
      {
        name: "Chat",
        pageUrl: "/chat/",
        imageUrl: "https://i.ibb.co/Nw6WW8J/download.png"
      },
      {
        name: "Bio",
        pageUrl: "/about/",
        imageUrl: "https://i.ibb.co/4RNR3CR3/jack.png"
      },
      {
        name: "1.14.4",
        pageUrl: "/1.14.4/",
        imageUrl: "https://i.ibb.co/Qj62zwBG/download.jpg"
      },
      {
        name: "info",
        pageUrl: "/info/",
        imageUrl: "https://i.ibb.co/9mLfZ6Nz/download-1.jpg"
      }

      /*
        TO ADD ANOTHER FILE, add a comma after the item above and paste:

        ,{
          name: "New Page",
          pageUrl: "PASTE_PAGE_LINK_HERE",
          imageUrl: "PASTE_ICON_IMAGE_LINK_HERE"
        }
      */
    ];



    const TOP_POPUP_SETTINGS = {
      // Direct image URL for the image that slides down from the top.
      imageUrl: "https://i.ibb.co/C5dxq6L4/Screenshot-2026-08-26-10-01-58-AM-removebg-preview.png",

      // Wait 5 seconds before the image slides down.
      appearDelay: 2500,

      // Keep the image visible for 5 seconds before it slides away.
      visibleDuration: 5000,

      // The title and message shown when t
      message: `Your address has been leaked to a dog, specifically YOUR dog, now there is nothing you can do, you have been cursed with 30 dogs who will wipe there ass on all your carpets.`
    };

    /* ============================================================
       DO NOT EDIT BELOW THIS LINE UNLESS YOU WANT TO CHANGE THE CODE
       ============================================================ */

    const desktop = document.getElementById("desktop");

    if (DESKTOP_BACKGROUND.imageUrl.trim()) {
      desktop.style.backgroundImage = `url("${DESKTOP_BACKGROUND.imageUrl}")`;
      desktop.style.backgroundSize = DESKTOP_BACKGROUND.size || "cover";
      desktop.style.backgroundPosition = DESKTOP_BACKGROUND.position || "center";

      // White text is easier to read over most wallpapers.
      document.documentElement.style.setProperty("--shortcut-text", "white");
    }

    DESKTOP_FILES.forEach((file) => {
      const shortcut = document.createElement("button");
      shortcut.className = "shortcut";
      shortcut.type = "button";
      shortcut.title = `Double-click to open ${file.name}`;

      if (DESKTOP_BACKGROUND.imageUrl.trim()) {
        shortcut.style.color = "white";
        shortcut.style.textShadow = "1px 1px 3px black";
      }

      const image = document.createElement("img");
      image.className = "shortcut-image";
      image.src = file.imageUrl;
      image.alt = `${file.name} icon`;
      image.draggable = false;

      image.addEventListener("error", () => {
        image.style.display = "none";
      });

      const name = document.createElement("span");
      name.className = "shortcut-name";
      name.textContent = file.name;

      shortcut.append(image, name);
      desktop.appendChild(shortcut);

      shortcut.addEventListener("click", (event) => {
        // Prevents a click from affecting the desktop while keeping
        // the shortcut free of a persistent selection highlight.
        event.stopPropagation();
      });

      shortcut.addEventListener("dblclick", () => {
        const link = file.pageUrl.trim();

        if (!link || link.startsWith("PASTE_")) {
          alert(`Add the pageUrl for ${file.name} in DESKTOP_FILES.`);
          return;
        }

        window.location.href = link;
      });
    });

  </script>

  <img
    id="cornerImage"
    class="corner-image"
    src="https://i.ibb.co/WvGf5jZp/Screenshot-2026-06-03-11-29-33-PM-removebg-preview.png"
    alt="YouTube"
  >

  <script>
    const cornerImage = document.getElementById("cornerImage");
    let hoverTimer;

    cornerImage.addEventListener("mouseenter", function () {
      hoverTimer = window.setTimeout(function () {
        window.location.href = "https://www.youtube.com/watch?v=xvFZjo5PgG0";
      }, 1000);
    });

    cornerImage.addEventListener("mouseleave", function () {
      window.clearTimeout(hoverTimer);
    });

    // Sets up the image that slides down from the top of the screen.
    if (
      TOP_POPUP_SETTINGS.imageUrl.trim() &&
      !TOP_POPUP_SETTINGS.imageUrl.startsWith("PASTE_")
    ) {
      topPopupImage.src = TOP_POPUP_SETTINGS.imageUrl;

      topPopupImage.addEventListener("load", () => {
        window.setTimeout(() => {
          // Slide the image down after the initial delay.
          topPopupImage.classList.add("visible");

          window.setTimeout(() => {
            // Slide the image back above the screen.
            // An open text popup is not affected and stays visible.
            topPopupImage.classList.remove("visible");
          }, TOP_POPUP_SETTINGS.visibleDuration);
        }, TOP_POPUP_SETTINGS.appearDelay);
      });
    } else {
      topPopupImage.style.display = "none";
    }

    friendMessageTitle.textContent = TOP_POPUP_SETTINGS.title;
    friendMessageText.textContent = TOP_POPUP_SETTINGS.message;

    function openFriendMessage() {
      messageOverlay.classList.add("open");
      messageOverlay.setAttribute("aria-hidden", "false");
      messageClose.focus();
    }

    function closeFriendMessage() {
      messageOverlay.classList.remove("open");
      messageOverlay.setAttribute("aria-hidden", "true");
    }

    topPopupImage.addEventListener("click", openFriendMessage);
    messageClose.addEventListener("click", closeFriendMessage);

    messageOverlay.addEventListener("click", (event) => {
      if (event.target === messageOverlay) {
        closeFriendMessage();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeFriendMessage();
      }
    });

  </script>
</body>
</html>
