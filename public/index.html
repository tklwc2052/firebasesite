.icons{position:absolute;top:4px;left:2px;bottom:var(--taskbar);display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,76px);grid-auto-columns:76px;gap:0;z-index:2}
.desktop-icon{width:74px;height:74px;border:1px solid transparent;background:transparent;color:#fff;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;cursor:default;text-shadow:1px 1px 2px #000}
.desktop-icon:hover,.desktop-icon.selected{background:rgba(84,159,219,.35);border-color:rgba(255,255,255,.38)}
.icon{width:44px;height:44px;display:grid;place-items:center;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35))}.icon svg{width:42px;height:42px}.label{font-size:12px;line-height:14px;text-align:center;max-width:72px;white-space:normal}
.taskbar{position:absolute;z-index:1000;left:0;right:0;bottom:0;height:var(--taskbar);display:flex;align-items:center;background:rgba(22,22,22,.88);backdrop-filter:blur(10px);box-shadow:0 -1px rgba(255,255,255,.08)}
.start-button{width:48px;height:40px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}.start-button:hover{background:rgba(255,255,255,.12)}.start-button svg{width:17px;height:17px;fill:#fff}.start-button:hover svg{fill:#00a4ef}
.searchbox{height:32px;width:290px;border:0;margin:0 2px 0 0;background:#f4f4f4;color:#111;display:flex;align-items:center;gap:8px;padding:0 10px}.searchbox svg{width:15px;height:15px;stroke:#222;fill:none;stroke-width:2}.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:12px}
.task-app{position:relative;width:42px;height:40px;border:0;background:transparent;color:white;display:grid;place-items:center;cursor:pointer}.task-app:hover{background:rgba(255,255,255,.12)}.task-app.active:after{content:"";position:absolute;bottom:0;left:5px;right:5px;height:2px;background:#76b9ed}.task-app svg{width:21px;height:21px}.folder-small{fill:#f7c948}.edge-small{fill:#11a8d4}
.tray{margin-left:auto;height:100%;display:flex;align-items:center}.tray-item{height:40px;min-width:27px;padding:0 5px;display:grid;place-items:center;font-size:12px}.tray-item:hover{background:rgba(255,255,255,.12)}.weather{display:flex;gap:5px;padding:0 12px;font-size:11px}.clock{min-width:75px;text-align:center;font-size:10px;line-height:14px;padding-top:5px}.showdesktop{width:5px;height:40px;border-left:1px solid rgba(255,255,255,.25)}
.start-menu{position:absolute;z-index:900;left:0;bottom:var(--taskbar);width:min(650px,100vw);height:min(640px,calc(100vh - var(--taskbar)));background:var(--panel);box-shadow:4px -4px 22px rgba(0,0,0,.5);display:none}.start-menu.open{display:flex;animation:rise .12s ease-out}@keyframes rise{from{transform:translateY(18px);opacity:.2}to{transform:none;opacity:1}}
.start-rail{width:48px;display:flex;flex-direction:column;align-items:center;padding:8px 0}.rail-button{width:48px;height:48px;border:0;background:transparent;color:#fff;display:grid;place-items:center;font-size:20px}.rail-button:hover{background:rgba(255,255,255,.12)}.rail-bottom{margin-top:auto}.start-list{width:260px;padding:10px 8px;overflow:auto}.start-title{font-size:13px;font-weight:600;padding:8px}.start-link{height:40px;width:100%;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:10px;padding:0 8px;text-align:left}.start-link:hover{background:rgba(255,255,255,.12)}.mini{width:26px;height:26px;display:grid;place-items:center}.mini svg{width:24px;height:24px}.tiles{flex:1;padding:16px 12px;overflow:auto}.tile-label{font-size:13px;margin:2px 0 8px}.tile-grid{display:grid;grid-template-columns:repeat(3,94px);grid-auto-rows:94px;gap:4px}.tile{border:0;background:#0078d7;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}.tile:hover{outline:2px solid rgba(255,255,255,.7);outline-offset:-2px}.tile.wide{grid-column:span 2}.tile svg{width:35px;height:35px}.tile span{font-size:12px}
.context{position:absolute;z-index:2000;display:none;width:215px;padding:3px;background:#f2f2f2;border:1px solid #aaa;box-shadow:3px 3px 9px rgba(0,0,0,.35);color:#111;font-size:12px}.context.open{display:block}.context button{width:100%;height:28px;border:0;background:transparent;text-align:left;padding:0 24px;color:#111}.context button:hover{background:#d9eaf7}.separator{height:1px;background:#ccc;margin:3px 0}
.window{position:absolute;z-index:50;display:none;flex-direction:column;width:min(760px,calc(100vw - 30px));height:min(500px,calc(100vh - 65px));left:50%;top:48%;transform:translate(-50%,-50%);background:#fff;color:#111;border:1px solid #777;box-shadow:0 12px 35px rgba(0,0,0,.45)}.window.open{display:flex}.titlebar{height:31px;display:flex;align-items:center;background:#fff;cursor:move}.window-title{flex:1;padding-left:9px;font-size:12px}.controls{height:100%;display:flex}.controls button{width:46px;border:0;background:transparent}.controls button:hover{background:#ddd}.controls .close:hover{background:#e81123;color:#fff}.window-body{flex:1;overflow:auto;padding:28px;background:#f7f7f7}.window-body h1{font-weight:400;font-size:38px;margin:0 0 12px}.window-body p{line-height:1.6;color:#444}.launch{display:inline-block;background:#0078d7;color:white;text-decoration:none;padding:10px 18px;margin:7px 7px 0 0}
@media(max-width:650px){.searchbox{width:44px;padding:0 14px}.searchbox input{display:none}.tiles{display:none}.start-list{flex:1}.start-menu{width:320px}.weather{display:none}}

.ui-image{display:block;width:22px;height:22px;object-fit:contain}.mini .ui-image{width:26px;height:26px}.tile>.ui-image{width:37px;height:37px}.rail-button .ui-image{width:21px;height:21px}.weather-image{width:18px;height:18px;object-fit:contain}.tray-image{width:16px;height:16px;object-fit:contain}.profile-image{width:24px;height:24px;border-radius:50%;object-fit:cover}.desktop-file-image{width:42px;height:42px;object-fit:contain;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35))}
</style>
</head>

<script>
const desktop=document.getElementById('desktop'),menu=document.getElementById('startMenu'),start=document.getElementById('startButton'),ctx=document.getElementById('context'),win=document.getElementById('welcomeWindow');let z=60;
function toggleMenu(force){const on=typeof force==='boolean'?force:!menu.classList.contains('open');menu.classList.toggle('open',on);start.style.background=on?'rgba(255,255,255,.15)':''}
function openWelcome(){win.classList.add('open');win.style.zIndex=++z;document.querySelector('[data-action="welcome"].task-app')?.classList.add('active');toggleMenu(false)}
function launch(el){if(el.dataset.url) location.href=el.dataset.url;if(el.dataset.action==='welcome')openWelcome()}
start.onclick=e=>{e.stopPropagation();toggleMenu()};document.querySelectorAll('[data-url],[data-action]').forEach(el=>{el.addEventListener(el.classList.contains('desktop-icon')?'dblclick':'click',e=>{e.stopPropagation();launch(el)})});
document.querySelectorAll('.desktop-icon').forEach(el=>el.onclick=e=>{document.querySelectorAll('.desktop-icon').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');e.stopPropagation()});
desktop.oncontextmenu=e=>{e.preventDefault();toggleMenu(false);ctx.classList.add('open');ctx.style.left=Math.min(e.clientX,innerWidth-220)+'px';ctx.style.top=Math.min(e.clientY,innerHeight-190)+'px'};
document.addEventListener('click',e=>{ctx.classList.remove('open');if(!menu.contains(e.target)&&!start.contains(e.target))toggleMenu(false)});
document.getElementById('refresh').onclick=()=>desktop.animate([{filter:'brightness(.75)'},{filter:'brightness(1)'}],160);document.getElementById('personalize').onclick=()=>alert('Send your wallpaper URL and I will place it here.');document.getElementById('power').onclick=()=>toggleMenu(false);
win.querySelector('.close').onclick=()=>{win.classList.remove('open');document.querySelector('[data-action="welcome"].task-app')?.classList.remove('active')};win.querySelector('.min').onclick=()=>win.classList.remove('open');win.querySelector('.max').onclick=()=>{win.style.left=win.style.left==='0px'?'50%':'0px';win.style.top=win.style.top==='0px'?'48%':'0px';win.style.transform=win.style.transform==='none'?'translate(-50%,-50%)':'none';win.style.width=win.style.width==='100vw'?'min(760px,calc(100vw - 30px))':'100vw';win.style.height=win.style.height==='calc(100vh - 40px)'?'min(500px,calc(100vh - 65px))':'calc(100vh - 40px)'};
let drag=false,ox=0,oy=0;win.querySelector('.titlebar').onmousedown=e=>{if(e.target.closest('button'))return;let r=win.getBoundingClientRect();drag=true;ox=e.clientX-r.left;oy=e.clientY-r.top;win.style.transform='none';win.style.left=r.left+'px';win.style.top=r.top+'px'};document.onmousemove=e=>{if(drag){win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-ox))+'px';win.style.top=Math.max(0,Math.min(innerHeight-50,e.clientY-oy))+'px'}};document.onmouseup=()=>drag=false;
document.getElementById('showDesktop').onclick=()=>win.classList.remove('open');document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();if(q.includes('chat'))location.href='https://example.com/chat';else if(q.includes('bio'))location.href='https://example.com/bio';else if(q.includes('mine'))location.href='https://example.com/minecraft';else toggleMenu(true)}};
function clock(){let d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}clock();setInterval(clock,1000);
</script>
