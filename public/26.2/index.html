<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Minecraft...</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
            background: #000;
            z-index: 999999;
        }
        #progress {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div id="loading">
    <div>Loading Minecraft...</div>
    <div id="progress">Starting...</div>
</div>
<script>
(async () => {
    const PART_URLS = [
        "https://raw.githubusercontent.com/tklwc2052/26.2/main/eaglercraft-26.2-u2pt1.html",
        "https://raw.githubusercontent.com/tklwc2052/26.2/main/eaglercraft-26.2-u2pt2.html",
        "https://raw.githubusercontent.com/tklwc2052/26.2/main/eaglercraft-26.2-u2pt3.html",
        "https://raw.githubusercontent.com/tklwc2052/26.2/main/eaglercraft-26.2-u2pt4.html"
    ];

    const progress = document.getElementById("progress");

    try {
        let html = "";

        for (let i = 0; i < PART_URLS.length; i++) {
            progress.textContent = `Loading part ${i + 1} of ${PART_URLS.length}...`;

            const response = await fetch(PART_URLS[i], {
                cache: "default"
            });

            if (!response.ok) {
                throw new Error(`Failed to load part ${i + 1}: HTTP ${response.status}`);
            }

            html += await response.text();
        }

        progress.textContent = "Starting Minecraft...";
        document.open();
        document.write(html);
        document.close();
    } catch (error) {
        console.error(error);
        document.getElementById("loading").innerHTML = `
            <h2>Failed to load Minecraft</h2>
            <p>${error.message}</p>
            <p>Try refreshing the page.</p>
        `;
    }
})();
</script>
</body>
</html>
