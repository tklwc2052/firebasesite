else if(a.intent==="talk"){let nk=pronounTargetFallback(a,r,p);if(nk){let npc=r.world.npcs[nk],before=knownNpcLabel(r,p,nk);rememberNpc(r,p,nk,"talk");let intro=(r.players[p].npcMemory[nk].interactions===1)?` They introduce themselves as ${npc.name}.`:"";text=`You speak to ${before}. `+pick(["They lower their voice and warn that something listens below the floor.","They say miners found a stone arch beneath the town.","They advise you to find the key before approaching the cellar."],d)+intro}else text=pick(["Your question hangs in the room without a clear answer.","Several patrons avoid meeting your eyes."],d)}
else if(a.intent==="steal"){let nk=pronounTargetFallback(a,r,p);if(nk){let label=knownNpcLabel(r,p,nk);rememberNpc(r,p,nk,"steal");text=d>=13?`You pickpocket ${label} and obtain 4 gold coins. They do not notice.`:`You try to pickpocket ${label}, but they catch your hand and become hostile.`;if(d<13)r.world.npcs[nk].hostile=true}else text="There is nobody clearly targeted to steal from."}
else if(a.intent==="restrain"){let nk=pronounTargetFallback(a,r,p);if(nk){let label=knownNpcLabel(r,p,nk);rememberNpc(r,p,nk,"restrain");text=d>=12?`You restrain ${label}. They cannot act freely for the moment.`:`You attempt to restrain ${label}, but they break away and become hostile.`;r.world.npcs[nk].hostile=true;r.world.npcs[nk].restrained=d>=12}else text="You need to name or approach someone to restrain."}
else if(a.intent==="interact")text=`You ${a.verb||"interact with"}${t||" the nearby object"}. It shifts slightly and reveals fresh scratches underneath.`;
else if(a.intent==="inventory")text=`You check your inventory: ${(pl.inventory||[]).join(", ")||"nothing"}.`;
else if(a.intent==="status")text=`You have ${pl.hp}/${pl.maxHp} HP and are currently at ${r.world.location}.`;
else if(a.intent==="move"){if(f.doorOpen&&/down|cellar|stairs|enter|descend/.test(a.n)){text="You descend into an ancient circular chamber.";change.location="Buried Stone Chamber";change.objective="Examine the stone arch";flags.chamber=true}else text=`You move ${a.direction||'carefully'} through the tavern, but the cellar remains the obvious path.`}
else if(BANK[a.intent])text=pick(BANK[a.intent],d);else text=`I could not resolve “${input}”. Try a clearer action with a verb and target, like “walk over to a random bystander and hit them”, “inspect the map”, “threaten the stranger”, “take the key”, “use the lantern”, or “sneak down the stairs”.`;
if(a.care&&a.intent!=="unknown")text="Carefully, "+text[0].toLowerCase()+text.slice(1);return{intent:a.intent,text,flags,patch,change,consume:a.intent!=="unknown"}}
async function act(){let input=document.getElementById("action").value.trim();if(!input)return;let fail="";let out=await ref.transaction(r=>{if(!r||r.turn.currentPlayer!==pid){fail="It is not your turn.";return}let x=resolve(r,pid,input);if(!x.consume){fail=x.text;return}r.world.flags=x.flags;if(x.change.location)r.world.location=x.change.location;if(x.change.objective)r.world.objective=x.change.objective;if(x.patch.inventory)r.players[pid].inventory=x.patch.inventory;let ids=order(r),next=ids[(ids.indexOf(pid)+1)%ids.length];r.world.turnNumber++;if(next===ids[0])r.world.round++;r.turn.currentPlayer=next;r.messages=r.messages||{};let k=`turn_${String(r.world.turnNumber).padStart(6,"0")}`;r.messages[k+"a"]={type:"action",author:r.players[pid].name,text:input,timestamp:Date.now()};r.messages[k+"n"]={type:"narration",author:"Game Master",text:x.text,timestamp:Date.now()+1};return r});if(!out.committed)toast(fail||"Action failed.");else document.getElementById("action").value=""}
function preset(x){let i=document.getElementById("action");if(!i.disabled){i.value=x;i.focus()}}function copyCode(){navigator.clipboard?.writeText(code);toast("Room code copied: "+code)}
</script></body></html>
