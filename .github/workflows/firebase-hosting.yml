name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILIKESPACEDOTCOM }}' > "$RUNNER_TEMP/firebase-key.json"

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:ilkspacedtcm --project ilikespacedotcom
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
